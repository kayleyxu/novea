    0%   { content: ""; }

  @keyframes spin { to { transform: rotate(360deg); } }

<body>

<div id="app"></div>

<script>
/**
 * @file AMD App v7 — PRL Prescription Tool
 *
 * WHAT THIS APP DOES
 * ------------------
 * This app helps eye doctors find the best place on a patient's retina
 * (called the Preferred Retinal Locus, or PRL) to aim light at — for
 * patients who have lost central vision due to conditions like AMD
 * (Age-related Macular Degeneration).
 *
 * HOW IT WORKS — THREE STEPS
 * ---------------------------
 * 1. DIAGNOSTIC  — The patient stares at a grid and marks the areas they
 *    can't see (scotoma) or where lines look wavy (distortion).
 * 2. MASK BUILD  — The app converts those grid markings into a precise
 *    damage map of the retina.
 * 3. PRESCRIPTION — The app searches the healthy retina for the best
 *    landing zone and returns an eccentricity (how far from center) and
 *    azimuth (which direction) for the metasurface lens prescription.
 *
 * CODE STRUCTURE
 * --------------
 * • Optics Math      — Converts between visual angles and retina coordinates
 * • Mask Builder     — Turns patient drawings into a retinal damage bitmap
 * • Scoring Engine   — Grades each candidate PRL location (higher = better)
 * • App State        — One object (appState) holds everything the UI needs
 * • Render Engine    — Builds the HTML from scratch whenever state changes
 * • Screen Renderers — One function per screen: Home, Diagnostic, Prescription
 */

// ═══════════════════════════════════════════════════════════════════════════════
// SHARED OPTICS MATH
// ═══════════════════════════════════════════════════════════════════════════════
const RETINA_DEG = 60;
const DISC_CX = -21.89, DISC_CY = -2.12, DISC_RX = 3.88, DISC_RY = 5.30;
const MASK_RES = 0.5, MASK_RANGE = 85;
const MASK_N = Math.ceil(MASK_RANGE / MASK_RES) * 2 + 2;
const K_EYE = (17 - 12) / 12;
const DTHETA = 1.0, DPHI = 3.0, E2 = 2.0;

/**
 * Checks whether a retinal coordinate (x, y) falls inside the optic disc —
 * the blind spot where the optic nerve connects to the back of the eye.
 * We never aim the PRL here because there are no photoreceptors.
 * The disc is modelled as an ellipse at its known anatomical position.
 *
 * @param {number} x - Horizontal retinal position in degrees (θ_c space)
 * @param {number} y - Vertical retinal position in degrees (θ_c space)
 * @returns {boolean} true if the point is inside the optic disc
 */
function inDisc(x, y) {
  return ((x-DISC_CX)/DISC_RX)**2 + ((y-DISC_CY)/DISC_RY)**2 < 1;
}
/**
 * Returns a quality score (0 to 1) for a retinal location based on how
 * far it is from the fovea (center). Cells closer to the fovea score
 * higher because they have more densely packed photoreceptors (cones)
 * and therefore better visual acuity.
 *
 * Formula: Q = E2 / (E2 + θ_c)  where E2 = 2° (half-resolution eccentricity)
 *
 * @param {number} tc - Distance from fovea in θ_c degrees
 * @returns {number} Quality score between 0 (far) and 1 (near fovea)
 */
function quality(tc) { return E2 / (E2 + Math.max(tc, 0)); }
/**
 * Converts a nodal angle (θ_n) to a center angle (θ_c).
 * The eye bends light through a nodal point, so the angle you see
 * (θ_n, measured from the nodal point) is slightly different from
 * the angle that lands on the retina (θ_c, measured from the eye center).
 * This conversion uses the eye's geometry constant K_EYE.
 *
 * @param {number} tn_deg - Visual angle in nodal degrees (θ_n)
 * @returns {number} Retinal angle in center degrees (θ_c)
 */
function thetaCenter(tn_deg) {
  const tn = tn_deg * Math.PI / 180;
  return tn_deg + Math.asin(Math.max(-1, Math.min(1, K_EYE * Math.sin(tn)))) * 180 / Math.PI;
}
/**
 * Calculates how fast θ_c changes relative to θ_n at a given angle.
 * This is the derivative dθ_c/dθ_n — needed to correctly calculate
 * the area of a small patch of retina (used in sphereArea).
 * Think of it as a "stretching factor" between visual space and retinal space.
 *
 * @param {number} tn_deg - Visual angle in nodal degrees
 * @returns {number} Rate of change dθ_c/dθ_n (dimensionless)
 */
function dTc_dTn(tn_deg) {
  const tn = tn_deg * Math.PI / 180;
  const s = K_EYE * Math.sin(tn);
  return 1 + K_EYE * Math.cos(tn) / Math.sqrt(Math.max(1e-12, 1 - s*s));
}
/**
 * Calculates the surface area of a tiny patch of retina at angle θ_n.
 * The retina is curved like the inside of a sphere, so patches farther
 * from the center cover more area. We use this to weight the score
 * correctly — a larger patch of healthy retina contributes more.
 *
 * @param {number} tn_deg - Visual angle in nodal degrees
 * @returns {number} Area of the retinal patch in steradians (solid angle units)
 */
function sphereArea(tn_deg) {
  const tc = thetaCenter(tn_deg) * Math.PI / 180;
  return Math.sin(tc) * dTc_dTn(tn_deg) * DTHETA * DPHI * (Math.PI/180)**2;
}
/**
 * Calculates the great-circle distance between two points on the retina.
 * Because the retina is a curved surface (like the Earth), the shortest
 * path between two points curves — just like a flight path on a globe.
 * This gives a more accurate distance than simple flat (Euclidean) math.
 *
 * @param {number} tn1 - Eccentricity of point 1 (nodal degrees)
 * @param {number} p1  - Azimuth of point 1 (degrees, 0–360)
 * @param {number} tn2 - Eccentricity of point 2 (nodal degrees)
 * @param {number} p2  - Azimuth of point 2 (degrees, 0–360)
 * @returns {number} Angular distance in degrees
 */
function gcDist(tn1, p1, tn2, p2) {
  const tc1 = thetaCenter(tn1)*Math.PI/180, tc2 = thetaCenter(tn2)*Math.PI/180;
  const dp = (p1-p2)*Math.PI/180;
  return Math.acos(Math.max(-1, Math.min(1,
    Math.cos(tc1)*Math.cos(tc2) + Math.sin(tc1)*Math.sin(tc2)*Math.cos(dp)
  ))) * 180/Math.PI;
}
/**
 * The reverse of thetaCenter — converts a retinal center angle (θ_c)
 * back to a nodal angle (θ_n). Because there is no simple formula to
 * go backwards, this uses Newton's method: it makes an initial guess
 * then refines it 8 times until the answer is very accurate.
 *
 * @param {number} tc_deg - Retinal angle in center degrees (θ_c)
 * @returns {number} Visual angle in nodal degrees (θ_n)
 */
function thetaNodal(tc_deg) {
  let tn = tc_deg * (12/17);
  for (let i = 0; i < 8; i++) {
    const f = tn + Math.asin(Math.max(-1,Math.min(1, K_EYE*Math.sin(tn*Math.PI/180))))*180/Math.PI - tc_deg;
    tn -= f / dTc_dTn(tn);
  }
  return Math.max(0, tn);
}

// ═══════════════════════════════════════════════════════════════════════════════
// MASK BUILDER
// ═══════════════════════════════════════════════════════════════════════════════
/**
 * Creates a simple pseudo-random number generator (PRNG) from a seed.
 * Give it the same seed and it always produces the same sequence of
 * numbers — useful for generating the demo patient's scotoma shape
 * consistently every time the app loads.
 *
 * @param {number} seed - Starting value (same seed = same sequence)
 * @returns {function} A function that returns a random number 0–1 each call
 */
function makeRng(seed) {
  let s = (seed ^ 0x9e3779b9) | 1;
  return () => { s ^= s<<13; s ^= s>>17; s ^= s<<5; return (s>>>0)/0x100000000; };
}
/**
 * Creates a smooth 1D noise function — like a gentle wavy line.
 * Used to add realistic irregular edges to the demo patient's scotoma
 * shape, so it looks like a real lesion rather than a perfect circle.
 *
 * @param {function} rng     - A random number generator (from makeRng)
 * @param {number}   nPoints - How many random control points to use
 * @returns {function} A function that takes a value 0–1 and returns smooth noise
 */
function makeNoise1D(rng, nPoints) {
  const vals = Array.from({length:nPoints}, ()=>rng()*2-1);
  return (t) => {
    const scaled = ((t%1)+1)%1*nPoints;
    const i0=Math.floor(scaled)%nPoints, i1=(i0+1)%nPoints;
    const f=scaled-Math.floor(scaled);
    return vals[i0]*(1-0.5*(1-Math.cos(f*Math.PI))) + vals[i1]*0.5*(1-Math.cos(f*Math.PI));
  };
}
/**
 * Creates a blob-shaped damaged region on the retina for the demo patient.
 * The shape is defined by a radius function (which varies by angle) plus
 * some random noise to make the edge look organic rather than geometric.
 * Returns a function you can call with (x, y) to check if a point is inside.
 *
 * @param {number}   ox       - Centre x position (degrees)
 * @param {number}   oy       - Centre y position (degrees)
 * @param {function} radiusFn - Function(angle) → radius at that angle
 * @param {number}   amp      - How much noise to add to the edge (degrees)
 * @param {function} rng      - Random number generator
 * @param {number}   nNoise   - Number of noise control points
 * @returns {function} A function(x, y) → true if inside the damaged region
 */
function makeSmoothRegion(ox, oy, radiusFn, amp, rng, nNoise) {
  const noise = makeNoise1D(rng, nNoise);
  return (x, y) => {
    const dx=x-ox, dy=y-oy;
    const r=Math.sqrt(dx*dx+dy*dy);
    const ang=((Math.atan2(dy,dx)*180/Math.PI)+360)%360;
    return r <= radiusFn(ang) + amp*noise(ang/360);
  };
}
/**
 * Builds the retinal damage map from a pre-filled bitmap array.
 * This is the fast version — instead of testing every grid cell against
 * dozens of shape functions (which was very slow), the damage areas are
 * already stamped into a flat array (dmgMask) before this function runs.
 *
 * The result is an object with lookup functions (damage, satellite, distort)
 * that let other parts of the app quickly ask "is this retinal point damaged?"
 *
 * @param {Uint8Array} dmgMask          - Pre-filled grid: 1 = damaged, 0 = healthy
 * @param {Array}      satellites       - List of small satellite lesion circles {cx,cy,r}
 * @param {Array}      annularExclusions - Ring-shaped areas to carve OUT of damage
 * @returns {{damage, satellite, distort, markDistort, mask, satMask, distortMask}}
 */
function buildMaskFromArrays(dmgMask, satellites=[], annularExclusions=[]) {
  const mask    = new Uint8Array(dmgMask); // copy
  const satMask = new Uint8Array(MASK_N*MASK_N);
  const idx = (gi,gj) => gj*MASK_N+gi;
  // Apply annular exclusions (carve out regions from damage mask)
  if (annularExclusions.length) {
    for (let gi=0;gi<MASK_N;gi++) {
      for (let gj=0;gj<MASK_N;gj++) {
        if (!mask[idx(gi,gj)]) continue;
        const x=gi*MASK_RES-MASK_RANGE, y=gj*MASK_RES-MASK_RANGE;
        for (const {cx,cy,r1,r2,angMin,angMax} of annularExclusions) {
          const dx=x-cx,dy=y-cy,r=Math.sqrt(dx*dx+dy*dy);
          const ang=((Math.atan2(dy,dx)*180/Math.PI)+360)%360;
          const inAng=angMax>angMin?(ang>=angMin&&ang<=angMax):(ang>=angMin||ang<=angMax);
          if (r>=r1&&r<=r2&&inAng){ mask[idx(gi,gj)]=0; break; }
        }
      }
    }
  }
  // Satellite mask
  for (let gi=0;gi<MASK_N;gi++) {
    for (let gj=0;gj<MASK_N;gj++) {
      if (mask[idx(gi,gj)]===1) continue;
      const x=gi*MASK_RES-MASK_RANGE, y=gj*MASK_RES-MASK_RANGE;
      if (inDisc(x,y)) continue;
      for (const {cx,cy,r} of satellites) {
        const dx=x-cx,dy=y-cy;
        if (dx*dx+dy*dy<r*r){ satMask[idx(gi,gj)]=1; break; }
      }
    }
  }
  const valid=(gi,gj)=>gi>=0&&gi<MASK_N&&gj>=0&&gj<MASK_N;
  const mxy=(x,y)=>{
    const gi=Math.round((x+MASK_RANGE)/MASK_RES);
    const gj=Math.round((y+MASK_RANGE)/MASK_RES);
    return {gi,gj,ok:valid(gi,gj)};
  };
  const distortMask=new Uint8Array(MASK_N*MASK_N);
  return {
    damage:(x,y)=>{const{gi,gj,ok}=mxy(x,y);return ok&&mask[idx(gi,gj)]===1;},
    satellite:(x,y)=>{const{gi,gj,ok}=mxy(x,y);return ok&&satMask[idx(gi,gj)]===1;},
    distort:(x,y)=>{const{gi,gj,ok}=mxy(x,y);return ok&&distortMask[idx(gi,gj)]===1;},
    markDistort:(x,y)=>{const gi=Math.round((x+MASK_RANGE)/MASK_RES);const gj=Math.round((y+MASK_RANGE)/MASK_RES);if(gi>=0&&gi<MASK_N&&gj>=0&&gj<MASK_N)distortMask[idx(gi,gj)]=1;},
    mask,satMask,distortMask
  };
}

/**
 * Builds a retinal damage map from a list of shape functions (closures).
 * Each function in `regions` takes (x, y) and returns true if that point
 * is damaged. This is only used for the built-in demo patients
 * because it's slower — it tests every grid cell against every shape.
 * Patient drawings from the Amsler grid use buildMaskFromArrays instead.
 *
 * @param {function[]} regions          - Array of (x,y)→boolean damage shape functions
 * @param {Array}      satellites       - Small satellite lesion circles
 * @param {Array}      annularExclusions - Ring areas to exclude from damage
 * @returns {object} Same structure as buildMaskFromArrays
 */
function buildMask(regions, satellites=[], annularExclusions=[]) {
  const dmgMask = new Uint8Array(MASK_N*MASK_N);
  const idx = (gi,gj) => gj*MASK_N+gi;
  for (let gi=0;gi<MASK_N;gi++) {
    for (let gj=0;gj<MASK_N;gj++) {
      const x=gi*MASK_RES-MASK_RANGE, y=gj*MASK_RES-MASK_RANGE;
      if (regions.some(fn=>fn(x,y))) dmgMask[idx(gi,gj)]=1;
    }
  }
  return buildMaskFromArrays(dmgMask, satellites, annularExclusions);
}

// ═══════════════════════════════════════════════════════════════════════════════
// BUILD MASK FROM AMSLER DRAWING
// ═══════════════════════════════════════════════════════════════════════════════
const AMSLER_CELLS     = 30;
const AMSLER_DEG       = 15;
const AMSLER_SUBSAMPLE = 5;
const AMSLER_CELL_MM   = 5;    // physical cell size: 5 mm
const AMSLER_DIST_MM   = 300;  // standard viewing distance: 300 mm (30 cm)

/**
 * Converts the patient's Amsler grid drawings into a retinal damage map.
 * The patient marks cells on a 30×30 grid (each cell = 1° of visual field).
 * This function translates those grid coordinates into real retinal positions
 * (in θ_c degrees) and stamps each marked area into a bitmap.
 *
 * It's fast because it uses "disc stamping" — for each sub-sampled point,
 * it fills a small circle in the bitmap rather than storing a closure function.
 * This avoids the 58-million-operation freeze that the old approach caused.
 *
 * @param {Set<string>} scotomaCells    - Whole painted cells "col,row"
 * @param {Set<string>} subScotomaCells - Half-size boundary trace cells
 * @param {Set<string>} distortCells    - Cells marked as wavy/distorted
 * @returns {object} Patient mask with damage/satellite/distort lookup functions
 */
function buildMaskFromAmsler(scotomaCells, subScotomaCells, distortCells) {
  // Direct bitmap rasterization — no closure array, no O(cells×regions) loop.
  // For each Amsler sub-sample point we compute its θ_c position + influence radius,
  // then stamp a filled circle directly into dmgMask.
  const dmgMask = new Uint8Array(MASK_N*MASK_N);
  const idx = (gi,gj) => gj*MASK_N+gi;

  // Stamp a disc of radius `inf` centered at (xc,yc) into dmgMask
  const stampDisc = (xc, yc, inf) => {
    const gi0 = Math.round((xc + MASK_RANGE) / MASK_RES);
    const gj0 = Math.round((yc + MASK_RANGE) / MASK_RES);
    const rad = Math.ceil(inf / MASK_RES) + 1;
    const inf2 = inf * inf;
    for (let dgi = -rad; dgi <= rad; dgi++) {
      for (let dgj = -rad; dgj <= rad; dgj++) {
        const gi = gi0 + dgi, gj = gj0 + dgj;
        if (gi < 0 || gi >= MASK_N || gj < 0 || gj >= MASK_N) continue;
        const dx = dgi * MASK_RES, dy = dgj * MASK_RES;
        if (dx*dx + dy*dy < inf2) dmgMask[idx(gi,gj)] = 1;
      }
    }
  };

  // Stamp central foveal disc (r < 0.5°)
  stampDisc(0, 0, 0.5);

  const rasteriseCell = (xmm_min, ymm_min, cellMM) => {
    const step = cellMM / AMSLER_SUBSAMPLE;
    const halfStep = step * 0.5;
    for (let si = 0; si < AMSLER_SUBSAMPLE; si++) {
      for (let sj = 0; sj < AMSLER_SUBSAMPLE; sj++) {
        const xmm = xmm_min + (si + 0.5) * step;
        const ymm = ymm_min + (sj + 0.5) * step;
        const rmm = Math.sqrt(xmm * xmm + ymm * ymm);
        if (rmm < 1e-6) continue;
        const rn  = Math.atan(rmm / AMSLER_DIST_MM) * 180 / Math.PI;
        const phi = Math.atan2(ymm, xmm);
        const tc  = thetaCenter(rn);
        const xc  = tc * Math.cos(phi), yc = tc * Math.sin(phi);
        const rmm_hi = rmm + halfStep * Math.SQRT2;
        const rn_hi  = Math.atan(rmm_hi / AMSLER_DIST_MM) * 180 / Math.PI;
        const tc_hi  = thetaCenter(rn_hi);
        const influence = (tc_hi - tc) + MASK_RES * 0.6;
        stampDisc(xc, yc, influence);
      }
    }
  };

  for (const key of scotomaCells) {
    const [c, r] = key.split(',').map(Number);
    const xmm_min = (c - AMSLER_CELLS / 2) * AMSLER_CELL_MM;
    const ymm_min = (AMSLER_CELLS / 2 - r - 1.0) * AMSLER_CELL_MM;
    rasteriseCell(xmm_min, ymm_min, AMSLER_CELL_MM);
  }
  for (const key of (subScotomaCells || [])) {
    const [sc, sr] = key.split(',').map(Number);
    const xmm_min = (sc * 0.5 - AMSLER_DEG) * AMSLER_CELL_MM;
    const ymm_min = (AMSLER_DEG - (sr + 1) * 0.5) * AMSLER_CELL_MM;
    rasteriseCell(xmm_min, ymm_min, AMSLER_CELL_MM * 0.5);
  }

  const pt = buildMaskFromArrays(dmgMask, [], []);

  // Stamp distortion cells directly into distortMask (skip damage/disc cells)
  for (const key of (distortCells || [])) {
    const [col, row] = key.split(',').map(Number);
    const xmm_min = (col - AMSLER_CELLS / 2) * AMSLER_CELL_MM;
    const ymm_min = (AMSLER_CELLS / 2 - row - 1.0) * AMSLER_CELL_MM;
    const step = AMSLER_CELL_MM / AMSLER_SUBSAMPLE;
    for (let si = 0; si < AMSLER_SUBSAMPLE; si++) {
      for (let sj = 0; sj < AMSLER_SUBSAMPLE; sj++) {
        const xmm = xmm_min + (si + 0.5) * step;
        const ymm = ymm_min + (sj + 0.5) * step;
        const rmm = Math.sqrt(xmm * xmm + ymm * ymm);
        if (rmm < 1e-6) continue;
        const rn  = Math.atan(rmm / AMSLER_DIST_MM) * 180 / Math.PI;
        const phi = Math.atan2(ymm, xmm);
        const tc  = thetaCenter(rn);
        const xc  = tc * Math.cos(phi), yc = tc * Math.sin(phi);
        if (!pt.damage(xc, yc) && !pt.satellite(xc, yc) && !inDisc(xc, yc))
          pt.markDistort(xc, yc);
      }
    }
  }
  return pt;
}

// ═══════════════════════════════════════════════════════════════════════════════
// PATIENT C — demo fallback
// ═══════════════════════════════════════════════════════════════════════════════

// SCORING ENGINE
// ═══════════════════════════════════════════════════════════════════════════════
// Pre-computed per-theta row cache — reused across all computeScore calls with same sigma
// Keyed by "sigma:tn_center" — rebuilt only when those change.
let _scoreCache = null;
/**
 * Returns a cached set of pre-computed trigonometry values for a given
 * (sigma, tn_center) combination. Computing cos/sin for every retinal cell
 * on every score call is slow — this cache reuses those values as long as
 * sigma and the candidate location haven't changed.
 *
 * Think of it like a lookup table: calculate once, reuse many times.
 *
 * @param {number} sigma     - Task radius parameter (degrees)
 * @param {number} tn_center - Eccentricity of the candidate PRL (nodal degrees)
 * @returns {object} Cache object with pre-computed rows, trig values, and cutoff
 */
function getScoreCache(sigma, tn_center) {
  const key = sigma + ':' + tn_center.toFixed(4);
  if (_scoreCache && _scoreCache.key === key) return _scoreCache;
  const dCutoff = sigma * 3.7;
  const thetaMin = Math.max(tn_center - dCutoff, 0.5);
  const thetaMax = Math.min(tn_center + dCutoff, RETINA_DEG);
  const phiSteps = Math.round(360 / DPHI);
  // Pre-compute per-theta constants
  const rows = [];
  for (let theta = thetaMin; theta <= thetaMax + DTHETA * 0.5; theta += DTHETA) {
    const tc = thetaCenter(theta);
    if (tc > MASK_RANGE) continue;
    const dA = sphereArea(theta);
    const ti = Math.round(theta / DTHETA);
    const tc_rad = tc * Math.PI / 180;
    // Pre-compute cos/sin for all phi values
    const phiData = new Float64Array(phiSteps * 4); // [cosP, sinP, phi_rad, placeholder] per phi
    for (let pi = 0; pi < phiSteps; pi++) {
      const phi = pi * DPHI;
      phiData[pi * 2]     = Math.cos(phi * Math.PI / 180);
      phiData[pi * 2 + 1] = Math.sin(phi * Math.PI / 180);
    }
    rows.push({theta, tc, dA, ti, tc_rad, phiData});
  }
  // Pre-compute cos/sin of tn_center for gcDist
  const tc2 = thetaCenter(tn_center) * Math.PI / 180;
  const cosTc2 = Math.cos(tc2), sinTc2 = Math.sin(tc2);
  _scoreCache = {key, rows, dCutoff, phiSteps, sigma, cosTc2, sinTc2, tn_center};
  return _scoreCache;
}

// Reusable Uint8Array for healthy bitmap — avoids GC pressure from Set
const _TI_MAX = 65, _PI_MAX = 120;
const _healthyBuf = new Uint8Array(_TI_MAX * _PI_MAX);

/**
 * Scores a single candidate PRL location (alpha_c, gammaDeg) on the retina.
 * Higher score = better location for the patient to aim their vision.
 *
 * The score formula is:  S = ∫∫ H · Q^β · G · dA  −  μ · F
 *
 *   H = Health factor (1 = healthy, 0 = damaged, partial for distorted)
 *   Q = Acuity quality — higher near the fovea (cones are denser there)
 *   G = Gaussian weight — cells closer to the target PRL count more
 *   dA = Retinal patch area (larger patches count more)
 *   F = Fragmentation penalty — penalises landing zones near lesion edges
 *   β = How much to emphasise acuity vs. area (slider in the UI)
 *   μ = How much to penalise fragmented edges (slider in the UI)
 *
 * Returns null if the candidate location is inside damaged tissue or the optic disc.
 *
 * @param {object} patient   - Retinal mask from buildMaskFromAmsler
 * @param {number} alpha_c   - Candidate eccentricity in θ_c degrees
 * @param {number} gammaDeg  - Candidate azimuth in degrees (0 = nasal, 90 = superior)
 * @param {number} sigma     - Task radius — how wide the useful area needs to be
 * @param {number} beta      - Acuity emphasis (0.05 = area only, 1 = full acuity)
 * @param {string} eye       - "right" or "left"
 * @param {number} hDistort  - Health weight for distorted (wavy) cells (default 0.3)
 * @returns {{mainScore, F, cellCount} | null}
 */
function computeScore(patient, alpha_c, gammaDeg, sigma, beta, eye, hDistort=0.3) {
  const _xs = (eye === "left") ? -1 : 1;
  if (alpha_c < 0.5) return null;
  const gRad = gammaDeg * Math.PI / 180;
  const lcx = _xs * alpha_c * Math.cos(gRad);
  const lcy = alpha_c * Math.sin(gRad);
  if (patient.damage(lcx,lcy) || patient.satellite(lcx,lcy) || inDisc(lcx,lcy)) return null;

  const tn_center = thetaNodal(alpha_c);
  const cache = getScoreCache(sigma, tn_center);
  const {rows, dCutoff, phiSteps, cosTc2, sinTc2} = cache;
  const sig2 = 2 * sigma * sigma;
  const cosG = Math.cos(gRad), sinG = Math.sin(gRad);

  // Accumulate directly — no cellList allocation
  let mainScore = 0, F = 0, cellCount = 0;
  // Track which (ti,pi) are healthy for fragmentation — use flat Uint8Array
  const hbuf = _healthyBuf;
  const usedTi = [];

  for (let ri = 0; ri < rows.length; ri++) {
    const {tc, dA, ti, tc_rad, phiData} = rows[ri];
    const cosTc1 = Math.cos(tc_rad), sinTc1 = Math.sin(tc_rad);
    const Q_beta = beta < 0.01 ? 1 : Math.pow(quality(tc), beta);
    let rowHasHealthy = false;

    for (let pi = 0; pi < phiSteps; pi++) {
      const cosP = phiData[pi * 2], sinP = phiData[pi * 2 + 1];
      // gcDist inline: angle between (tc_rad, phi) and (tc2, gammaDeg)
      const dot = cosTc1 * cosTc2 + sinTc1 * sinTc2 * (cosP * cosG + sinP * sinG);
      const d = Math.acos(Math.max(-1, Math.min(1, dot))) * 180 / Math.PI;
      if (d > dCutoff) continue;

      const G = Math.exp(-d * d / sig2);
      const cx = _xs * tc * cosP, cy = tc * sinP;
      const _dmg = patient.damage(cx,cy) || patient.satellite(cx,cy) || inDisc(cx,cy);
      const H = _dmg ? 0 : (patient.distort && patient.distort(cx,cy) ? hDistort : 1);

      mainScore += H * Q_beta * G * dA;
      cellCount++;

      if (H === 1) {
        hbuf[ti * _PI_MAX + pi] = 1;
        rowHasHealthy = true;
      }
    }
    if (rowHasHealthy) usedTi.push(ti);
  }

  // Fragmentation: count unhealthy neighbours for healthy cells
  for (let ri = 0; ri < rows.length; ri++) {
    const {dA, ti, tc_rad, phiData} = rows[ri];
    const cosTc1 = Math.cos(tc_rad), sinTc1 = Math.sin(tc_rad);
    for (let pi = 0; pi < phiSteps; pi++) {
      if (!hbuf[ti * _PI_MAX + pi]) continue;
      const cosP = phiData[pi * 2], sinP = phiData[pi * 2 + 1];
      const dot = cosTc1 * cosTc2 + sinTc1 * sinTc2 * (cosP * cosG + sinP * sinG);
      const d = Math.acos(Math.max(-1, Math.min(1, dot))) * 180 / Math.PI;
      const G = Math.exp(-d * d / sig2);
      const pip1 = (pi + 1) % phiSteps, pim1 = (pi - 1 + phiSteps) % phiSteps;
      let unhealthy = 0;
      if (ti > 0         && !hbuf[(ti-1)*_PI_MAX+pi])   unhealthy++;
      if (ti < _TI_MAX-1 && !hbuf[(ti+1)*_PI_MAX+pi])   unhealthy++;
      if (!hbuf[ti*_PI_MAX+pim1]) unhealthy++;
      if (!hbuf[ti*_PI_MAX+pip1]) unhealthy++;
      if (unhealthy) F += G * dA * unhealthy / 8;
    }
  }

  // Clear only the cells we touched
  for (const ti of usedTi)
    for (let pi = 0; pi < phiSteps; pi++)
      hbuf[ti * _PI_MAX + pi] = 0;

  return {mainScore, F, cellCount};
}

/**
 * Searches the entire retina for the best PRL location by testing a grid
 * of candidate positions (eccentricity 0.5°–35°, azimuth every 5°).
 * All candidates are scored with computeScore, then the one with the
 * highest combined score (after applying the fragmentation penalty μ) wins.
 *
 * Note: This is the synchronous version, used internally.
 * The UI uses findOptimalChunked instead so the page doesn't freeze.
 *
 * @param {object} patient  - Retinal mask
 * @param {number} sigma    - Task radius
 * @param {number} beta     - Acuity emphasis
 * @param {number} mu       - Fragmentation penalty weight
 * @param {string} eye      - "right" or "left"
 * @param {number} hDistort - Health weight for distorted cells
 * @returns {{alpha_c, alpha, gamma, score}} Best location found
 */
function findOptimal(patient, sigma, beta, mu, eye, hDistort=0.3) {
  let best=-Infinity, ba_c=thetaCenter(1), bg=0;
  const ac_min=thetaCenter(0.5), ac_max=thetaCenter(35);
  const candidates=[];
  for (let ac=ac_min;ac<=ac_max;ac+=1.4) {
    for (let g=0;g<360;g+=5) {
      const s=computeScore(patient,ac,g,sigma,beta,eye);
      if (!s) continue;
      candidates.push({ac,g,raw:s.mainScore,F:s.F});
    }
  }
  if (!candidates.length) return {alpha_c:ba_c,alpha:thetaNodal(ba_c),gamma:bg,score:0};
  const maxRaw=Math.max(...candidates.map(c=>c.raw));
  const maxF=Math.max(...candidates.map(c=>c.F))||1e-9;
  for (const c of candidates) {
    const score=c.raw/maxRaw-mu*(c.F/maxF);
    if (score>best){ best=score; ba_c=c.ac; bg=c.g; }
  }
  return {alpha_c:ba_c,alpha:thetaNodal(ba_c),gamma:bg,score:best};
}

// roundRect polyfill for older browsers
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    this.beginPath();
    this.moveTo(x+r,y); this.lineTo(x+w-r,y); this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y);
    this.closePath(); return this;
  };
}

// RETINAL MAP CANVAS — draws into a <canvas> element
// ═══════════════════════════════════════════════════════════════════════════════
/**
 * Draws the retinal damage map onto a circular canvas element.
 * Each pixel is coloured based on what's at that retinal location:
 *   Green  = healthy retina (brighter near fovea)
 *   Red    = damaged (scotoma / GA lesion)
 *   Orange = satellite lesion
 *   Yellow = distorted (metamorphopsia) zone
 *   Tan    = optic disc (blind spot)
 *
 * If optima are provided (after running the optimizer), it also draws
 * coloured circles showing the three PRL candidates (orange, blue, gray).
 * The user can toggle each zone on/off using appState.mapZoneVis.
 *
 * @param {HTMLCanvasElement} canvas         - The canvas to draw on
 * @param {object}            patient        - Retinal mask from buildMaskFromAmsler
 * @param {number}            alpha          - Current PRL eccentricity (nodal degrees)
 * @param {number}            gamma          - Current PRL azimuth (degrees)
 * @param {number}            sigma          - Task radius for drawing the rings
 * @param {number}            committedSigma - Sigma value locked in when optimizer ran
 * @param {object|null}       optima         - {weighted, Aonly, Conly} PRL candidates
 * @param {number}            size           - Canvas width/height in pixels
 * @param {string}            eye            - "right" or "left" (mirrors x-axis for left)
 */
function drawRetinalMap(canvas, patient, alpha, gamma, sigma, committedSigma, optima, size, eye) {
  eye = eye || "right";
  const ctx = canvas.getContext("2d");
  const cSigma = committedSigma ?? sigma;
  const cx=size/2, cy=size/2, R=size/2-14;
  ctx.clearRect(0,0,size,size);
  const img=ctx.createImageData(size,size), d=img.data;
  for (let py=0;py<size;py++) {
    for (let px=0;px<size;px++) {
      const sdx=px-cx,sdy=py-cy,pr=Math.sqrt(sdx*sdx+sdy*sdy);
      if (pr>R) continue;
      const ecc_n=(pr/R)*RETINA_DEG, ecc_c=thetaCenter(ecc_n);
      const sAng=Math.atan2(sdy,sdx);
      const xDraw=ecc_c*Math.cos(sAng), yD=-ecc_c*Math.sin(sAng);
      // Damage mask coords: same as drawing (visual field, no flip needed)
      // Disc/satellite: flip x for left eye (disc is nasal retina, opposite side)
      const _xS=(eye==="left")?-1:1;
      const xD=_xS*xDraw;
      const t=Math.min(quality(ecc_c)*1.3,1);
      const isDmg=patient.damage(xDraw,yD),isSat=patient.satellite(xDraw,yD),isDisc=inDisc(xD,yD);
      const isDist=!isDmg&&!isSat&&!isDisc&&patient.distort&&patient.distort(xDraw,yD);
      const ii=(py*size+px)*4;
      if(isDisc){d[ii]=200;d[ii+1]=185;d[ii+2]=140;d[ii+3]=255;}
      else if(isSat){d[ii]=255;d[ii+1]=120;d[ii+2]=20;d[ii+3]=255;}
      else if(isDmg){d[ii]=Math.floor(210-t*50);d[ii+1]=20;d[ii+2]=20;d[ii+3]=255;}
      else if(isDist){d[ii]=Math.floor(200+t*40);d[ii+1]=Math.floor(140+t*40);d[ii+2]=0;d[ii+3]=255;}
      else {
        // Rich emerald: near-fovea bright lime→emerald, periphery deep green
        // Soft spring green: light sage at fovea fading to medium green at periphery
        const er=Math.floor(130+t*100), eg=Math.floor(210+t*40), eb=Math.floor(130+t*70);
        d[ii]=er; d[ii+1]=eg; d[ii+2]=eb; d[ii+3]=255;
      }
    }
  }
  ctx.putImageData(img,0,0);

  const eccToPx=e=>(e/RETINA_DEG)*R;
  const _eyeXSign=(eye==="left")?-1:1;
  const drawZone=(a_n,g,col,label,rgb=[0,90,45])=>{
    if (a_n<0.5) return;
    const r2=g*Math.PI/180;
    const lxR=a_n*Math.cos(r2),lyR=a_n*Math.sin(r2);
    const scrAng=Math.atan2(-lyR,_eyeXSign*lxR);
    const lPr=eccToPx(a_n);
    const lpx=cx+lPr*Math.cos(scrAng),lpy=cy+lPr*Math.sin(scrAng);
    const sPx=eccToPx(thetaNodal(cSigma))*0.82;
    const im2=ctx.getImageData(0,0,size,size),d2=im2.data;
    const ext2=sPx*2.5;
    for (let py2=Math.max(0,Math.floor(lpy-ext2));py2<=Math.min(size-1,Math.ceil(lpy+ext2));py2++) {
      for (let px2=Math.max(0,Math.floor(lpx-ext2));px2<=Math.min(size-1,Math.ceil(lpx+ext2));px2++) {
        const ddx=px2-lpx,ddy=py2-lpy;
        if (ddx*ddx+ddy*ddy>ext2*ext2) continue;
        const gw=Math.exp(-0.5*(ddx*ddx+ddy*ddy)/(sPx*sPx));
        if (gw<0.04) continue;
        const pr2=Math.sqrt((px2-cx)**2+(py2-cy)**2);
        const e2_c=thetaCenter((pr2/R)*RETINA_DEG);
        const sa2=Math.atan2(py2-cy,px2-cx);
        const xR2=_eyeXSign*e2_c*Math.cos(sa2),yR2=-e2_c*Math.sin(sa2);
        const bad=patient.damage(xR2,yR2)||patient.satellite(xR2,yR2)||inDisc(xR2,yR2);
        const ii=(py2*size+px2)*4;
        if (!bad){ d2[ii]=Math.min(d2[ii]+Math.floor(rgb[0]*gw),255);d2[ii+1]=Math.min(d2[ii+1]+Math.floor(rgb[1]*gw),255);d2[ii+2]=Math.min(d2[ii+2]+Math.floor(rgb[2]*gw),255); }
        else { d2[ii]=Math.min(d2[ii]+Math.floor(130*gw),255);d2[ii+1]=Math.max(d2[ii+1]-Math.floor(20*gw),0); }
      }
    }
    ctx.putImageData(im2,0,0);
    [1,2].forEach(sig=>{
      ctx.beginPath(); ctx.arc(lpx,lpy,sPx*sig,0,Math.PI*2);
      ctx.strokeStyle=col; ctx.lineWidth=sig===1?2.5:1.3;
      ctx.setLineDash(sig===1?[]:[4,3]); ctx.stroke(); ctx.setLineDash([]);
    });
    const aA=Math.atan2(lpy-cy,lpx-cx);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(lpx-14*Math.cos(aA),lpy-14*Math.sin(aA));
    ctx.strokeStyle=col+"88"; ctx.lineWidth=1.5; ctx.setLineDash([3,2]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(lpx,lpy);
    ctx.lineTo(lpx-10*Math.cos(aA-.4),lpy-10*Math.sin(aA-.4));
    ctx.lineTo(lpx-10*Math.cos(aA+.4),lpy-10*Math.sin(aA+.4));
    ctx.closePath(); ctx.fillStyle=col; ctx.fill();
    if (label) {
      ctx.font="bold 13px monospace"; ctx.textAlign="center";
      // Dark pill background for readability on any retinal color
      const lx=lpx, ly=lpy-sPx-8;
      const tw=ctx.measureText(label).width;
      ctx.fillStyle="rgba(0,0,0,0.72)"; ctx.beginPath();
      ctx.roundRect(lx-tw/2-5,ly-12,tw+10,16,4); ctx.fill();
      ctx.fillStyle=col==="rgba(0,0,0,0.72)"?"#fff":col;
      ctx.fillText(label,lx,ly);
    }
  };
  const _vis=appState.mapZoneVis;
  if (optima) {
    if (optima.Conly    && _vis.Conly)    drawZone(optima.Conly.alpha,    optima.Conly.gamma,    "#1e90ff",null,[0,60,130]);
    if (optima.Aonly    && _vis.Aonly)    drawZone(optima.Aonly.alpha,    optima.Aonly.gamma,    "#b0b0b0",null,[50,50,50]);
    if (optima.weighted && _vis.weighted) drawZone(optima.weighted.alpha, optima.weighted.gamma, "#ff6b00",null,[110,60,0]);
  } else {
    drawZone(alpha,gamma,"#ff6b00",null,[110,60,0]);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,size,size);
  ctx.arc(cx,cy,R,0,Math.PI*2,true); ctx.fillStyle="#eceaf5"; ctx.fill("evenodd"); ctx.restore();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.strokeStyle="#8b1a8f"; ctx.lineWidth=2; ctx.stroke();
  [5,10,20,30,45].forEach((dg,i)=>{
    const r=(thetaNodal(dg)/RETINA_DEG)*R;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=i<2?"rgba(30,30,80,0.4)":"rgba(30,30,80,0.18)";
    ctx.lineWidth=i<2?1:0.7; ctx.setLineDash(i<2?[]:[4,4]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="rgba(20,20,70,0.85)"; ctx.font="bold 9px monospace"; ctx.textAlign="left";
    ctx.fillText(`${dg}°`,cx+r+3,cy-2);
  });
  ctx.beginPath(); ctx.arc(cx,cy,2.5,0,Math.PI*2); ctx.fillStyle="white"; ctx.fill();
  ctx.strokeStyle="#cc1010"; ctx.lineWidth=1.5; ctx.stroke();
  ctx.textBaseline="alphabetic";
  // S/I/T/N — drawn last, just inside the circle edge so they're always visible
  ctx.font="bold 13px monospace";
  ctx.textBaseline="middle"; ctx.textAlign="center";
  const lR=R-16;
  const _tx=eye==="left"?cx+lR:cx-lR, _nx=eye==="left"?cx-lR:cx+lR;
  [{text:"S",x:cx,y:cy-lR},{text:"I",x:cx,y:cy+lR},{text:"T",x:_tx,y:cy},{text:"N",x:_nx,y:cy}].forEach(({text,x,y})=>{
    const tw=ctx.measureText(text).width+10;
    const th=20;
    ctx.fillStyle="rgba(10,18,40,0.80)";
    ctx.fillRect(x-tw/2, y-th/2, tw, th);
    ctx.fillStyle="#f0f6ff";
    ctx.fillText(text, x, y+1);
  });
  ctx.textBaseline="alphabetic";
}

// ═══════════════════════════════════════════════════════════════════════════════
// DIAGNOSTIC CANVAS DRAWING
// ═══════════════════════════════════════════════════════════════════════════════
const CELL_PX  = 18;
const GRID_N   = 30;
const GRID_DEG = 15;
const CANVAS_PX = GRID_N * CELL_PX;  // 540
const SUB = 2;
const SUB_CELL_PX = CELL_PX / SUB;   // 9
const SUB_N = GRID_N * SUB;           // 60

/**
 * Draws the Amsler grid onto the diagnostic canvas.
 * The grid is 30×30 cells on a black background, with:
 *   Red cells     = scotoma (areas the patient can't see)
 *   Orange cells  = distortion (wavy lines)
 *   White lines   = grid lines
 *   Blue circles  = 5°, 10°, 15° eccentricity rings for reference
 *   White/red dot = fixation target at the center
 *
 * @param {HTMLCanvasElement} canvas         - Canvas to draw on
 * @param {Set<string>}       scotomaCells    - Painted scotoma cells "col,row"
 * @param {Set<string>}       subScotomaCells - Half-size boundary trace cells
 * @param {Set<string>}       distortCells    - Distortion cells
 */
function drawAmslerGrid(canvas, scotomaCells, subScotomaCells, distortCells) {
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,CANVAS_PX,CANVAS_PX);
  ctx.fillStyle="#000"; ctx.fillRect(0,0,CANVAS_PX,CANVAS_PX);

  for (const key of scotomaCells) {
    const [c,r]=key.split(',').map(Number);
    ctx.fillStyle="rgba(220,38,38,0.72)";
    ctx.fillRect(c*CELL_PX+1,r*CELL_PX+1,CELL_PX-2,CELL_PX-2);
  }
  ctx.fillStyle="rgba(220,38,38,0.80)";
  for (const key of subScotomaCells) {
    const [sc,sr]=key.split(',').map(Number);
    ctx.fillRect(sc*SUB_CELL_PX,sr*SUB_CELL_PX,SUB_CELL_PX,SUB_CELL_PX);
  }
  for (const key of distortCells) {
    const [c,r]=key.split(',').map(Number);
    ctx.fillStyle="rgba(245,158,11,0.4)";
    ctx.fillRect(c*CELL_PX+1,r*CELL_PX+1,CELL_PX-2,CELL_PX-2);
    ctx.strokeStyle="rgba(245,158,11,0.9)"; ctx.lineWidth=1.5;
    ctx.beginPath();
    const bx=c*CELL_PX+2, by=r*CELL_PX+CELL_PX/2;
    for (let i=0;i<=CELL_PX-4;i++) {
      const yy=by+Math.sin((i/(CELL_PX-4))*Math.PI*2.5)*3.5;
      i===0?ctx.moveTo(bx+i,yy):ctx.lineTo(bx+i,yy);
    }
    ctx.stroke();
  }

  ctx.strokeStyle="rgba(255,255,255,0.95)"; ctx.lineWidth=1.0;
  for (let i=0;i<=GRID_N;i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL_PX,0); ctx.lineTo(i*CELL_PX,CANVAS_PX); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL_PX); ctx.lineTo(CANVAS_PX,i*CELL_PX); ctx.stroke();
  }
  ctx.strokeStyle="white"; ctx.lineWidth=2;
  ctx.strokeRect(1,1,CANVAS_PX-2,CANVAS_PX-2);

  const cxg=CANVAS_PX/2, cyg=CANVAS_PX/2;
  [[5,"rgba(37,99,235,0.5)"],[10,"rgba(37,99,235,0.3)"],[15,"rgba(37,99,235,0.18)"]].forEach(([deg,col],i)=>{
    const rPx=(deg/GRID_DEG)*(CANVAS_PX/2);
    ctx.beginPath(); ctx.arc(cxg,cyg,rPx,0,Math.PI*2);
    ctx.strokeStyle=col; ctx.lineWidth=1;
    ctx.setLineDash(i<2?[4,4]:[2,4]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="rgba(37,99,235,0.8)"; ctx.font="8px monospace"; ctx.textAlign="left";
    ctx.fillText(`${deg}°`,cxg+rPx+3,cyg-3);
  });
  ctx.beginPath(); ctx.arc(cxg,cyg,7,0,Math.PI*2);
  ctx.fillStyle="white"; ctx.fill();
  ctx.strokeStyle="#ef4444"; ctx.lineWidth=2.5; ctx.stroke();
}

/**
 * Draws the live cursor trail on the transparent overlay canvas
 * while the patient is actively dragging in boundary trace mode.
 * This runs on every mouse-move event and shows the curve being drawn
 * before it is committed to the scotoma map on mouse release.
 *
 * @param {HTMLCanvasElement} canvas     - Overlay canvas (sits on top of main canvas)
 * @param {Array}             livePoints - Array of {x,y} points collected so far
 * @param {boolean}           isDrawing  - Whether the user is currently dragging
 * @param {string}            tool       - Current tool (only draws for "boundary" tool)
 */
function drawOverlay(canvas, livePoints, isDrawing, tool) {
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,CANVAS_PX,CANVAS_PX);
  const pts = livePoints;
  if (!isDrawing || tool!=="boundary" || pts.length<2) return;
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for (let i=1;i<pts.length-1;i++) {
    const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
    ctx.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);
  }
  ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
  ctx.strokeStyle="rgba(210,90,30,0.95)"; ctx.lineWidth=2.5; ctx.setLineDash([]); ctx.stroke();
  ctx.beginPath(); ctx.arc(pts[0].x,pts[0].y,5,0,Math.PI*2);
  ctx.strokeStyle="#c2410c"; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(pts[0].x,pts[0].y,2,0,Math.PI*2);
  ctx.fillStyle="#c2410c"; ctx.fill();
  const last=pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last.x,last.y,3,0,Math.PI*2);
  ctx.fillStyle="rgba(210,90,30,0.7)"; ctx.fill();
}

// FLOOD FILL helpers
// ═══════════════════════════════════════════════════════════════════════════════
/**
 * Fills the interior of a closed boundary curve with scotoma cells.
 * When the patient draws a curve around a damaged area, this function
 * starts from the centre of the enclosed region and spreads outward
 * (like paint bucket fill in a drawing app) until it hits the boundary
 * strokes or reaches the edge of the grid.
 *
 * @param {Set<string>} wallSet  - Boundary cells that act as walls
 * @param {number}      startC   - Starting column (usually centre of curve)
 * @param {number}      startR   - Starting row
 * @param {number}      maxCells - Safety limit to stop infinite spread
 * @param {number}      gridN    - Grid size (e.g. 60 for sub-cell grid)
 * @returns {Set<string>|null} Filled interior cells, or null if fill failed
 */
function floodFill(wallSet, startC, startR, maxCells, gridN) {
  const filled=new Set();
  const key=(c,r)=>`${c},${r}`;
  const startKey=key(startC,startR);
  if (wallSet.has(startKey)) return new Set();
  const queue=[[startC,startR]], visited=new Set([startKey]);
  while (queue.length>0) {
    const [c,r]=queue.shift();
    if (c<0||c>=gridN||r<0||r>=gridN) return null;
    if (wallSet.has(key(c,r))) continue;
    filled.add(key(c,r));
    if (filled.size>maxCells) return null;
    for (const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nk=key(c+dc,r+dr);
      if (!visited.has(nk)){ visited.add(nk); queue.push([c+dc,r+dr]); }
    }
  }
  return filled;
}

/**
 * Converts a smooth hand-drawn curve (list of pixel coordinates) into
 * a set of grid cells on the sub-cell grid, then flood-fills the interior.
 * This is called when the patient releases the mouse after boundary tracing —
 * it turns their freehand stroke into precise grid markings.
 *
 * @param {Array}  pts       - Array of {x,y} pixel points along the drawn curve
 * @param {number} subN      - Number of sub-cells per side (GRID_N × SUB)
 * @param {number} subCellPx - Size of each sub-cell in pixels
 * @returns {Set<string>|null} Sub-cell keys for the filled region, or null if invalid
 */
function rasterizeCurveToGrid(pts, subN, subCellPx) {
  if (pts.length<3) return null;
  const wallSet=new Set();
  const markSubCell=(x,y)=>{
    const sc=Math.floor(x/subCellPx), sr=Math.floor(y/subCellPx);
    if (sc>=0&&sc<subN&&sr>=0&&sr<subN) wallSet.add(`${sc},${sr}`);
  };
  for (let i=0;i<pts.length-1;i++) {
    const dx=pts[i+1].x-pts[i].x, dy=pts[i+1].y-pts[i].y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const steps=Math.max(1,Math.ceil(dist));
    for (let s=0;s<=steps;s++) markSubCell(pts[i].x+dx*(s/steps),pts[i].y+dy*(s/steps));
  }
  { const dx=pts[0].x-pts[pts.length-1].x, dy=pts[0].y-pts[pts.length-1].y;
    const dist=Math.sqrt(dx*dx+dy*dy), steps=Math.max(1,Math.ceil(dist));
    for (let s=0;s<=steps;s++) markSubCell(pts[pts.length-1].x+dx*(s/steps),pts[pts.length-1].y+dy*(s/steps)); }
  const maxCells=Math.floor(subN*subN*0.65);
  const foveaSC=Math.floor(subN/2), foveaSR=Math.floor(subN/2);
  let filled=floodFill(wallSet,foveaSC,foveaSR,maxCells,subN);
  if (!filled) {
    let sumC=0,sumR=0,n=0;
    wallSet.forEach(k=>{ const [c,r]=k.split(',').map(Number); sumC+=c; sumR+=r; n++; });
    if (n>0) filled=floodFill(wallSet,Math.round(sumC/n),Math.round(sumR/n),maxCells,subN);
  }
  if (!filled||filled.size===0) return null;
  return new Set([...wallSet,...filled]);
}

/**
 * Converts a mouse or touch event position into canvas pixel coordinates.
 * Handles the case where the canvas is displayed smaller than its internal
 * resolution (e.g. scaled down for iPad) by applying the correct ratio.
 * Returns null if the click/touch was outside the canvas boundary.
 *
 * @param {Event}             e      - Mouse or touch event
 * @param {HTMLCanvasElement} canvas - The canvas element
 * @returns {{x, y}|null} Canvas-space coordinates, or null if out of bounds
 */
function getCanvasXY(e, canvas) {
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(CANVAS_PX/rect.width);
  const y=(e.clientY-rect.top)*(CANVAS_PX/rect.height);
  if (x<0||x>CANVAS_PX||y<0||y>CANVAS_PX) return null;
  return {x,y};
}
/**
 * Converts canvas pixel coordinates into an Amsler grid cell key "col,row".
 * The grid is GRID_N × GRID_N cells; each cell is CELL_PX pixels wide.
 * Returns null if the coordinates are outside the grid.
 *
 * @param {number} x - Canvas x coordinate in pixels
 * @param {number} y - Canvas y coordinate in pixels
 * @returns {string|null} Cell key like "14,8", or null if outside grid
 */
function getCellFromXY(x,y) {
  const col=Math.floor(x/CELL_PX), row=Math.floor(y/CELL_PX);
  if (col<0||col>=GRID_N||row<0||row>=GRID_N) return null;
  return `${col},${row}`;
}

// RENDER ENGINE — pure DOM manipulation, no framework
// ═══════════════════════════════════════════════════════════════════════════════

/**
 * A tiny helper function that creates an HTML element — similar to
 * how React's createElement works, but much simpler.
 *
 * Instead of writing:
 *   const div = document.createElement("div");
 *   div.style.color = "red";
 *   div.textContent = "Hello";
 *
 * You can write:
 *   h("div", {style:{color:"red"}}, "Hello")
 *
 * @param {string} tag        - HTML tag name ("div", "button", "canvas", etc.)
 * @param {object|null} attrs - Attributes: style object, event handlers (onclick etc.), class
 * @param {...any} children   - Child elements or text strings to put inside
 * @returns {HTMLElement} The created element with all attributes and children attached
 */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k,v] of Object.entries(attrs)) {
      if (k==="style" && typeof v==="object") Object.assign(el.style, v);
      else if (k.startsWith("on") && typeof v==="function") el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k==="class") el.className=v;
      else if (k==="disabled") { if (v) el.disabled=true; }
      else el.setAttribute(k,v);
    }
  }
  function appendAny(child) {
    if (child==null || child===false || child===true || child===undefined) return;
    if (Array.isArray(child)) { child.forEach(appendAny); return; }
    if (child instanceof Node) { el.appendChild(child); return; }
    el.appendChild(document.createTextNode(String(child)));
  }
  children.forEach(appendAny);
  return el;
}

// KaTeX render helper — returns a <span> with rendered math
/**
 * Renders a LaTeX math formula into an HTML span using the KaTeX library.
 * Used throughout the prescription screen to display the scoring formula.
 * If KaTeX fails (e.g. bad LaTeX syntax), falls back to showing raw text.
 *
 * @param {string}  latex   - The LaTeX string to render (e.g. "\\sigma^2")
 * @param {boolean} display - If true, renders in display (centred block) mode
 * @returns {HTMLElement} A <span> containing the rendered formula
 */
function tex(latex, display=false) {
  const span = document.createElement("span");
  span.style.cssText = display
    ? "display:block;text-align:center;margin:6px 0;"
    : "display:inline-block;vertical-align:middle;";
  try {
    katex.render(latex, span, {throwOnError:false, displayMode:display});
  } catch(e) {
    span.textContent = latex;
  }
  return span;
}

/**
 * Returns a base style object for buttons used throughout the app.
 * Extra properties can be passed to override or extend the defaults.
 * Used with the h() helper: h("button", {style: btnStyle({color:"red"})})
 *
 * @param {object} extra - Additional style properties to merge in
 * @returns {object} A CSS style object
 */
function btnStyle(extra={}) {
  return {padding:"9px 16px",border:"none",borderRadius:"4px",cursor:"pointer",
    fontSize:"12px",fontFamily:"monospace",fontWeight:"700",transition:"all 0.15s",...extra};
}
/**
 * Returns a base style object for white card panels used throughout
 * the prescription screen. Adds a subtle border, border-radius, padding
 * and drop shadow. Extra properties can override the defaults.
 *
 * @param {object} extra - Additional style properties to merge in
 * @returns {object} A CSS style object
 */
function card(extra={}) {
  return {background:"#ffffff",border:"1px solid #e8d0ec",borderRadius:"8px",
    padding:"14px 16px",marginBottom:"12px",
    boxShadow:"0 1px 4px rgba(107,0,112,0.07)",...extra};
}
/**
 * Creates a small all-caps purple section heading element.
 * Used as the title inside card panels (e.g. "SCORE PARAMETERS").
 *
 * @param {string} text - The label text to display
 * @returns {HTMLElement} A styled <span> element
 */
function secLabel(text) {
  return h("span",{style:{fontSize:"11px",fontWeight:"700",letterSpacing:"2px",color:"#6b0070",
    textTransform:"uppercase",display:"block",marginBottom:"10px",fontFamily:"monospace",
    borderBottom:"1px solid #e8d0ec",paddingBottom:"6px"}}, text);
}
function sliderEl({label,min,max,step,val,color,note,fmt,onChange,onLiveInput}) {
  const wrap=h("div",{style:{marginBottom:"12px",padding:"9px 12px",background:"#faf5fb",
    border:`1px solid ${color}50`,borderRadius:"4px"}});
  const valSpan=h("span",{style:{fontSize:"13px",fontWeight:"700",color,fontFamily:"monospace"}},fmt(val));
  const row=h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:"3px"}},
    h("span",{style:{fontSize:"12px",fontWeight:"700",color:"#3d0042",fontFamily:"monospace"}},label),
    valSpan
  );
  wrap.appendChild(row);
  if (note) wrap.appendChild(h("div",{style:{fontSize:"10px",color:"#1a1a1a",marginBottom:"4px",fontFamily:"monospace"}},note));
  const slClass=color==="#cc3300"?"sigma-slider":color==="#5b9bd5"?"beta-slider":color==="#d97706"?"hdist-slider":"mu-slider";
  const inp=h("input",{type:"range",min,max,step,value:String(val),class:slClass,style:{width:"100%"}});
  // During drag: update display + patch state silently, no render()
  inp.addEventListener("input",e=>{
    const v=+e.target.value;
    valSpan.textContent=fmt(v);
    if (onLiveInput) onLiveInput(v);
  });
  // On release: commit with a full render
  inp.addEventListener("change",e=>{ onChange(+e.target.value); });
  wrap.appendChild(inp);
  return wrap;
}

// ── Import scotoma map from JSON ────────────────────────────────────────────
/**
 * Loads a previously saved scotoma map from a JSON file.
 * The file is read by the browser's FileReader, parsed, and converted
 * back into a patient mask — allowing the doctor to reload a patient's
 * data without re-doing the Amsler test.
 *
 * Shows a loading overlay while the mask is being rebuilt (which takes
 * a fraction of a second) so the UI doesn't appear frozen.
 *
 * @param {File}   file     - The JSON file selected by the user
 * @param {string} forceEye - Override the eye field: "right" or "left"
 */
function loadDamageMap(file, forceEye) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const payload = JSON.parse(e.target.result);
      if (!payload.scotomaCells) throw new Error("Invalid format — missing scotomaCells");
      if (forceEye) payload.eye = forceEye;
      if (!payload.eye) throw new Error("Invalid format — missing eye field");
      // Show loading indicator immediately before heavy buildMaskFromAmsler call
      appState.importing = payload.eye;
      render();
      setTimeout(()=>{
        try {
          const scotomaCells    = new Set(payload.scotomaCells);
          const subScotomaCells = new Set(payload.subScotomaCells || []);
          const distortCells    = new Set(payload.distortCells   || []);
          const patient = buildMaskFromAmsler(scotomaCells, subScotomaCells, distortCells);
          const wholeCells  = scotomaCells.size;
          const subCells    = subScotomaCells.size;
          const totalDeg2   = wholeCells + subCells * 0.25;
          const distortDeg2 = distortCells.size;
          const patientData = {patient, scotomaCells, subScotomaCells, distortCells,
            eye:payload.eye, wholeCells, subCells, totalDeg2, distortDeg2};
          const _eye = payload.eye;
          if (_eye === "right") {
            appState.patientDataRight = patientData;
            appState.rx = mkRxSlot();
          } else {
            appState.patientDataLeft = patientData;
            appState.rxLeft = mkRxSlot();
          }
          appState.rxEV = {alpha_c:0,gamma:0,status:"idle",optima:null,committedSigma:5,
            omega:appState.rxEV?.omega??0.5,sigma:5,beta:0.5,mu:0.2,hDistort:0.3};
          appState.binocularMode = !!(appState.patientDataRight && appState.patientDataLeft);
          appState.importing = null;
          setState({patientData, screen:"prescription"});
        } catch(err) {
          appState.importing = null;
          render();
          alert("Could not import scotoma map: " + err.message);
        }
      }, 30);
    } catch(err) {
      appState.importing = null;
      alert("Could not import scotoma map: " + err.message);
    }
  };
  reader.readAsText(file);
}

// ═══════════════════════════════════════════════════════════════════════════════
// v8 — BINOCULAR MS CO-PRESCRIPTION OPTIMIZER
// ═══════════════════════════════════════════════════════════════════════════════
/**
 * Returns the smallest angular difference between two azimuths (0–360°).
 * Result is in [0, 180].
 */
function angDiff(a, b) {
  const d = Math.abs(((a - b) + 360) % 360);
  return d > 180 ? 360 - d : d;
}

/**
 * Binocular MS co-prescription optimizer (v8).
 * Searches independently over (α_R, γ_R) and (α_L, γ_L), maximising
 * ω·S_R + (1−ω)·S_L subject to:
 *   |α_R − α_L| ≤ deltaAlpha  and  angDiff(γ_R, γ_L) ≤ deltaGamma
 * Uses the established head-fixed gamma convention (mirroredGamma for left eye).
 * Does NOT call rxAutoRun, rxAutoRunEV, or findOptimalChunked.
 */
function rxAutoRunMS() {
  const pdR = appState.patientDataRight || appState.patientData;
  const pdL = appState.patientDataLeft;
  if (!pdR || !pdL) return;
  const ms = appState.rxMS;
  const omega      = ms.omega      ?? 0.5;
  const deltaAlpha = ms.deltaAlpha ?? 2;
  const deltaGamma = ms.deltaGamma ?? 15;
  const beta       = ms.beta       ?? 0.5;
  const sigma      = ms.sigma      ?? 5;
  const mu         = ms.mu         ?? 0.2;
  const hDistort   = ms.hDistort   ?? 0.3;

  const _patch = (pct) => {
    const btn = document.getElementById("ms-coopt-btn");
    if (!btn) return;
    if (pct < 100) {
      btn.textContent = `▶  Generate MS Co-Prescription  ${pct}%`;
      btn.style.background = `linear-gradient(90deg,#6b0070 ${pct}%,#ddd6fe ${pct}%)`;
      btn.style.color = "#fff"; btn.disabled = true;
    } else {
      btn.textContent = "▶  Generate MS Co-Prescription";
      btn.style.background = "#6b0070"; btn.style.color = "#fff"; btn.disabled = false;
    }
  };
  _patch(0);
  appState.rxMS.status = "computing";

  const ac_min = thetaCenter(0.5), ac_max = thetaCenter(35);
  const acSteps = [];
  for (let ac = ac_min; ac <= ac_max; ac += 1.4) acSteps.push(ac);
  const CHUNK = 20;
  const mirG = g => (180 - g + 360) % 360;
  let candR = [], candL = [];

  let iR = 0;
  function buildR() {
    const end = Math.min(iR + CHUNK, acSteps.length);
    for (; iR < end; iR++) {
      const ac = acSteps[iR];
      for (let g = 0; g < 360; g += 5) {
        const s = computeScore(pdR.patient, ac, g, sigma, beta, "right", hDistort);
        if (s) candR.push({ac, g, raw: s.mainScore, F: s.F});
      }
    }
    _patch(Math.round(iR / acSteps.length * 33));
    if (iR < acSteps.length) { setTimeout(buildR, 0); return; }
    iL = 0; setTimeout(buildL, 0);
  }

  let iL = 0;
  function buildL() {
    const end = Math.min(iL + CHUNK, acSteps.length);
    for (; iL < end; iL++) {
      const ac = acSteps[iL];
      for (let g = 0; g < 360; g += 5) {
        const s = computeScore(pdL.patient, ac, mirG(g), sigma, beta, "left", hDistort);
        if (s) candL.push({ac, g, raw: s.mainScore, F: s.F});
      }
    }
    _patch(33 + Math.round(iL / acSteps.length * 33));
    if (iL < acSteps.length) { setTimeout(buildL, 0); return; }
    setTimeout(combine, 0);
  }

  function combine() {
    const maxRR = Math.max(...candR.map(c => c.raw)) || 1e-9;
    const maxFR = Math.max(...candR.map(c => c.F))   || 1e-9;
    const maxRL = Math.max(...candL.map(c => c.raw)) || 1e-9;
    const maxFL = Math.max(...candL.map(c => c.F))   || 1e-9;

    // Build maps: key = "ac,g" => normalised score
    const mapR = new Map(), mapL = new Map();
    for (const c of candR) {
      mapR.set(c.ac.toFixed(4)+","+c.g, {sc: c.raw/maxRR - mu*(c.F/maxFR), ac: c.ac, g: c.g});
    }
    for (const c of candL) {
      mapL.set(c.ac.toFixed(4)+","+c.g, {sc: c.raw/maxRL - mu*(c.F/maxFL), ac: c.ac, g: c.g});
    }
    _patch(66);

    // Group left candidates by alpha key for faster constraint search
    const leftByAlpha = new Map();
    for (const l of mapL.values()) {
      const aKey = l.ac.toFixed(4);
      if (!leftByAlpha.has(aKey)) leftByAlpha.set(aKey, []);
      leftByAlpha.get(aKey).push(l);
    }

    let bestScore = -Infinity, bestR = null, bestL = null;
    for (const r of mapR.values()) {
      const alphaN_R = thetaNodal(r.ac);
      for (const [aKey, lArr] of leftByAlpha) {
        if (Math.abs(alphaN_R - thetaNodal(parseFloat(aKey))) > deltaAlpha + 0.05) continue;
        for (const l of lArr) {
          if (angDiff(r.g, l.g) > deltaGamma + 0.05) continue;
          const joint = omega * r.sc + (1 - omega) * l.sc;
          if (joint > bestScore) { bestScore = joint; bestR = r; bestL = l; }
        }
      }
    }

    // Fallback if no pair found within constraint
    if (!bestR || !bestL) {
      bestR = [...mapR.values()].sort((a,b)=>b.sc-a.sc)[0];
      bestL = [...mapL.values()].sort((a,b)=>b.sc-a.sc)[0];
    }

    appState.rxMS = { ...appState.rxMS,
      status:"done",
      alpha_cR: bestR.ac, gammaR: bestR.g,
      alpha_cL: bestL.ac, gammaL: bestL.g,
      optima: {R: bestR, L: bestL, score: bestScore}
    };
    _patch(100);
    render();
  }

  setTimeout(buildR, 0);
}

/**
 * Attaches all mouse and touch event listeners to the Amsler grid overlay canvas.
 * Must be called once after the canvas is inserted into the DOM.
 * Handles three drawing tools (boundary trace, paint, erase) and touch events.
 *
 * For boundary trace: collects points during drag, commits on release.
 * For paint/erase: applies cell changes on every mousemove during drag.
 *
 * @param {HTMLCanvasElement} canvas - The transparent overlay canvas to wire up
 */
function wireCanvasEvents(canvas) {
  canvas.onmousedown = (e) => {
    const xy=getCanvasXY(e,canvas); if (!xy) return;
    _drawingActive=true;
    const d=appState.diag;
    if (d.tool==="boundary") {
      _livePointsRef=[xy];
      // Don't call setDiag here — just update state flag silently to avoid re-render
      appState.diag.isDrawing=true;
      appState.diag.livePoints=_livePointsRef;
      // Draw overlay directly — no full re-render
      if (_diagOverlayRef) drawOverlay(_diagOverlayRef,_livePointsRef,true,"boundary");
    } else {
      appState.diag.isDrawing=true;
      applyPaintAt(xy);
    }
  };
  canvas.onmousemove = (e) => {
    if (!_drawingActive) return;
    const xy=getCanvasXY(e,canvas); if (!xy) return;
    const d=appState.diag;
    if (d.tool==="boundary") {
      const last=_livePointsRef[_livePointsRef.length-1];
      const dx=xy.x-last.x, dy=xy.y-last.y;
      if (Math.sqrt(dx*dx+dy*dy)>3) {
        _livePointsRef.push(xy); // mutate in place — no re-render
        // Redraw overlay canvas directly — zero DOM cost
        if (_diagOverlayRef) drawOverlay(_diagOverlayRef,_livePointsRef,true,"boundary");
      }
    } else {
      applyPaintAt(xy);
    }
  };
  canvas.onmouseup = canvas.onmouseleave = () => {
    if (!_drawingActive) return;
    _drawingActive=false;
    const d=appState.diag;
    if (d.tool==="boundary" && _livePointsRef.length>=3) {
      const allSub=rasterizeCurveToGrid(_livePointsRef,SUB_N,SUB_CELL_PX);
      if (allSub) {
        // Commit: now do the full setDiag re-render once on mouseup
        setDiag({subScotomaCells:new Set([...d.subScotomaCells,...allSub]),isDrawing:false,livePoints:[]});
      } else {
        setDiag({isDrawing:false,livePoints:[]});
      }
      _livePointsRef=[];
    } else if (d.tool==="boundary") {
      // Short stroke — just clear overlay, no commit
      appState.diag.isDrawing=false;
      appState.diag.livePoints=[];
      _livePointsRef=[];
      if (_diagOverlayRef) drawOverlay(_diagOverlayRef,[],false,"boundary");
    } else {
      appState.diag.isDrawing=false;
    }
  };
  // Touch support
  canvas.ontouchstart = (e) => { e.preventDefault(); canvas.onmousedown(e.touches[0]); };
  canvas.ontouchmove  = (e) => { e.preventDefault(); canvas.onmousemove(e.touches[0]); };
  canvas.ontouchend   = (e) => { e.preventDefault(); canvas.onmouseup(); };
}

/**
 * Applies the current drawing tool (paint, distortion, or erase) at a single
 * canvas coordinate. Called on every mousemove during a paint or erase drag.
 *
 * Mutates appState.diag.scotomaCells / distortCells directly (no render())
 * and redraws only the canvas, so dragging stays smooth with no DOM rebuild.
 * Also patches the counter labels and generate button state directly.
 *
 * @param {{x:number, y:number}} xy - Canvas pixel coordinate from getCanvasXY
 */
function applyPaintAt(xy) {
  const d=appState.diag;
  const key=getCellFromXY(xy.x,xy.y); if (!key) return;
  if (d.tool==="paint") {
    if(d.scotomaCells.has(key))return;
    d.scotomaCells.add(key); d.distortCells.delete(key);
  } else if (d.tool==="distortion") {
    if(d.distortCells.has(key))return;
    d.distortCells.add(key); d.scotomaCells.delete(key);
  } else if (d.tool==="erase") {
    if(!d.scotomaCells.has(key)&&!d.distortCells.has(key))return;
    d.scotomaCells.delete(key); d.distortCells.delete(key);
  } else { return; }
  if(_diagCanvasRef) drawAmslerGrid(_diagCanvasRef,d.scotomaCells,d.subScotomaCells,d.distortCells);
  const sEl=document.getElementById("diag-scotoma-count");
  const dEl=document.getElementById("diag-distort-count");
  if(sEl) sEl.textContent="Scotoma: "+(d.scotomaCells.size+d.subScotomaCells.size)+" Amsler squares";
  if(dEl){dEl.textContent="Distortion: "+d.distortCells.size+" Amsler squares";dEl.style.display=d.distortCells.size>0?"":"none";}
  const gBtn=document.getElementById("diag-gen-btn");
  if(gBtn) gBtn.disabled=d.scotomaCells.size===0&&d.subScotomaCells.size===0&&d.distortCells.size===0;
}

/**
 * Called when the patient clicks "GENERATE DAMAGE MAP".
 * Converts the Amsler grid drawings into a retinal damage mask and
 * transitions to the Prescription screen.
 *
 * Shows a generating spinner immediately, then after a short delay:
 *   1. Calls buildMaskFromAmsler to convert grid cells → retinal bitmap
 *   2. Stores the patient data (mask + cell counts) in appState
 *   3. Enables binocular mode if both eyes are now scanned
 *   4. Calls setState to navigate to the prescription screen
 */
function diagFinish() {
  const d=appState.diag;
  // Show spinner on the button immediately before heavy computation
  setDiag({generating:true});
  setTimeout(()=>{
    const patient=buildMaskFromAmsler(d.scotomaCells,d.subScotomaCells,d.distortCells);
    // Count total Amsler grid cells (θ_n space, 1°/cell)
    // scotomaCells = whole 1° cells; subScotomaCells = 0.5° cells (boundary trace)
    const wholeCells = d.scotomaCells.size;           // each = 1°×1° = 1 deg² visual field
    const subCells   = d.subScotomaCells.size;         // each = 0.5°×0.5° = 0.25 deg²
    const totalDeg2  = wholeCells + subCells * 0.25;   // total area in deg² (θ_n visual field)
    const distortDeg2 = d.distortCells.size;           // 1°×1° each
    const patientData={
      patient,
      scotomaCells: new Set(d.scotomaCells),
      subScotomaCells: new Set(d.subScotomaCells),
      distortCells: new Set(d.distortCells),
      eye: d.eye,
      wholeCells,
      subCells,
      totalDeg2,
      distortDeg2
    };
    appState.diag.generating = false;
    const _eye = d.eye;
    if (_eye === "right") {
      appState.patientDataRight = patientData;
      appState.rx = mkRxSlot();
    } else {
      appState.patientDataLeft = patientData;
      appState.rxLeft = mkRxSlot();
    }
    appState.rxEV = {alpha_c:0,gamma:0,status:"idle",optima:null,committedSigma:5,omega:appState.rxEV?.omega??0.5,sigma:appState.rxEV?.sigma??5,beta:appState.rxEV?.beta??0.5,mu:appState.rxEV?.mu??0.2,hDistort:appState.rxEV?.hDistort??0.3};
    const binocularMode = !!(appState.patientDataRight && appState.patientDataLeft);
    appState.binocularMode = binocularMode;
    setState({patientData, screen:"prescription"});
  },30);
}

// PRESCRIPTION MODULE
// ═══════════════════════════════════════════════════════════════════════════════
let _rxMapCanvasRef=null;
let _rxMapCanvasRefL=null;  // left MS map
let _rxMapCanvasRefEVR=null; // EV right map
let _rxMapCanvasRefEVL=null; // EV left map
let _rxMapCanvasRefMSR=null; // MS co-opt right map (v8)
let _rxMapCanvasRefMSL=null; // MS co-opt left map  (v8)
let _rxDebounce=null;

// ─── Chunked optimizer (CSP-safe, non-blocking) ──────────────────────────────
/**
 * Searches for the best PRL location without freezing the browser.
 * It does the same search as findOptimal, but breaks the work into
 * small chunks (CHUNK alpha steps at a time) and uses setTimeout to
 * yield control back to the browser between chunks — so the progress
 * bar can update and the UI stays responsive.
 *
 * After all chunks finish, calls onDone(result) with the best location.
 * Calls onProgress(stepsDone, totalSteps) after each chunk so the
 * progress bar can update.
 *
 * @param {object}   patient    - Retinal mask
 * @param {number}   sigma      - Task radius
 * @param {number}   beta       - Acuity emphasis
 * @param {number}   mu         - Fragmentation penalty
 * @param {string}   eye        - "right" or "left"
 * @param {number}   hDistort   - Distortion health weight
 * @param {function} onDone     - Called with the best result when finished
 * @param {function} onProgress - Called with (stepsDone) after each chunk
 */
function findOptimalChunked(patient, sigma, beta, mu, eye, hDistort=0.3, onDone, onProgress, totalSteps) {
  const ac_min=thetaCenter(0.5), ac_max=thetaCenter(35);
  const acSteps=[];
  for(let ac=ac_min;ac<=ac_max;ac+=1.4) acSteps.push(ac);
  const CHUNK=8; // smaller chunks = more progress updates
  let i=0;
  const candidates=[];

  // For left eye, search in head-fixed gamma space:
  // score at mirroredGamma in retinal coords, store head-fixed g as result.
  const _mirrorG = (eye==="left") ? (g=>(180-g+360)%360) : (g=>g);

  function runChunk() {
    const end=Math.min(i+CHUNK, acSteps.length);
    for(; i<end; i++) {
      const ac=acSteps[i];
      for(let g=0;g<360;g+=5) {
        const s=computeScore(patient,ac,_mirrorG(g),sigma,beta,eye,hDistort);
        if(!s) continue;
        candidates.push({ac,g,raw:s.mainScore,F:s.F}); // g is head-fixed
      }
    }
    if(onProgress) onProgress(i, acSteps.length);
    if(i<acSteps.length) { setTimeout(runChunk,0); return; }
    // done — find best
    if(!candidates.length){ onDone({alpha_c:thetaCenter(1),alpha:thetaNodal(thetaCenter(1)),gamma:0,score:0}); return; }
    const maxRaw=Math.max(...candidates.map(c=>c.raw));
    const maxF=Math.max(...candidates.map(c=>c.F))||1e-9;
    let best=-Infinity,ba_c=thetaCenter(1),bg=0;
    for(const c of candidates){
      const score=c.raw/maxRaw-mu*(c.F/maxF);
      if(score>best){best=score;ba_c=c.ac;bg=c.g;}
    }
    onDone({alpha_c:ba_c,alpha:thetaNodal(ba_c),gamma:bg,score:best});
  }
  setTimeout(runChunk,0);
}

/**
 * Runs the PRL optimizer for one eye and stores the results in appState.
 * It runs three searches in parallel (one for each beta setting):
 *   - "weighted" : uses the doctor's chosen β value  (shown in orange)
 *   - "Conly"    : uses β=1 (full acuity emphasis)   (shown in blue)
 *   - "Aonly"    : uses β=0.05 (area-only emphasis)  (shown in gray)
 *
 * Each search is chunked (non-blocking) and reports progress. When all
 * three finish, the prescription panel updates with the results.
 *
 * @param {string} [eye] - "right" or "left" (defaults to the last scanned eye)
 */
function rxAutoRun(eye) {
  const _eye = eye || (appState.patientData ? appState.patientData.eye : "right");
  const isLeft = _eye === "left";
  const rx = isLeft ? appState.rxLeft : appState.rx;
  const pd = isLeft ? (appState.patientDataLeft || appState.patientData)
                    : (appState.patientDataRight || appState.patientData);
  const patient = pd ? pd.patient : PATIENT_DEMO_R.patient;
  const setFn = isLeft ? setRxLeft : setRx;
  // Compute total ac steps for progress tracking
  const ac_min=thetaCenter(0.5), ac_max=thetaCenter(35);
  let totalAcSteps=0;
  for(let ac=ac_min;ac<=ac_max;ac+=1.4) totalAcSteps++;
  const totalWork = 3 * totalAcSteps; // 3 betas
  const progressPerBeta = new Array(3).fill(0);
  const betaKeys = ['Aonly','Conly','weighted'];

  // Patch the run button in-place — no render(), no scroll reset
  const _btnId = isLeft ? "rx-run-btn-left" : "rx-run-btn";
  const _patchRunBtn = (pct) => {
    const btn = document.getElementById(_btnId);
    if (!btn) return;
    btn.textContent = `▶  Generate Prescription  ${pct}%`;
    btn.style.background = `linear-gradient(90deg, #8b2090 ${pct}%, #d8b8dc ${pct}%)`;
    btn.style.color = "#ffffff";
    btn.style.border = "1px solid #8b2090";
    btn.disabled = true;
  };

  const updateProgress = () => {
    const completed = progressPerBeta.reduce((a,b)=>a+b,0);
    const pct = Math.min(99, Math.round(completed / totalWork * 100));
    // Mutate state silently — no render()
    const rxSlot = isLeft ? appState.rxLeft : appState.rx;
    rxSlot.status = "computing";
    rxSlot.progress = pct;
    _patchRunBtn(pct);
  };

  // Initial state — mutate directly, patch button
  (isLeft ? appState.rxLeft : appState.rx).status = "computing";
  (isLeft ? appState.rxLeft : appState.rx).progress = 0;
  _patchRunBtn(0);
  const results = {};
  const betas = {Aonly:0.05, Conly:1, weighted:rx.beta};
  let done = 0;
  betaKeys.forEach((key, ki) => {
    findOptimalChunked(patient, rx.sigma, betas[key], rx.mu, _eye, rx.hDistort??0.3,
      res => {
        results[key] = res;
        progressPerBeta[ki] = totalAcSteps;
        if (++done === 3) {
          const oW = results.weighted;
          setFn({committedSigma:rx.sigma,
            optima:{Aonly:results.Aonly, Conly:results.Conly, weighted:oW},
            alpha_c:oW.alpha_c, gamma:oW.gamma, status:"done", progress:100});
        }
      },
      (stepsDone) => {
        progressPerBeta[ki] = stepsDone;
        updateProgress();
      }
    );
  });
}

// ── EV joint optimizer ────────────────────────────────────────────────────────
// Single (alpha_c, gamma) maximising omega*RCS_R + (1-omega)*RCS_L
/**
 * Runs the joint Eccentric Viewing (EV) optimizer for both eyes simultaneously.
 * Finds a single (α, γ) pair that maximises the weighted combination:
 *   score = ω · RCS_right + (1−ω) · RCS_left
 * where ω (omega) is the right-eye weight slider set by the clinician.
 *
 * Runs three variants in parallel (Aonly, Conly, weighted) using chunked
 * setTimeout loops to stay non-blocking. Results are stored in appState.rxEV
 * and the prescription screen updates when all three complete.
 */
function rxAutoRunEV() {
  const pdR = appState.patientDataRight || appState.patientData;
  const pdL = appState.patientDataLeft;
  if (!pdR || !pdL) return;
  const evRxP = appState.rxEV;
  const omega = evRxP.omega ?? 0.5;
  setRxEV({status:"computing"});
  const ac_min=thetaCenter(0.5), ac_max=thetaCenter(35);
  const acSteps=[];
  for(let ac=ac_min;ac<=ac_max;ac+=1.4) acSteps.push(ac);
  const CHUNK=25;
  const betas={Aonly:0.05, Conly:1, weighted:evRxP.beta??0.5};
  let slotsRemaining = 3;
  const optResults = {};
  Object.entries(betas).forEach(([key, beta]) => {
    let i=0; const candidates=[];
    function runChunk() {
      const end=Math.min(i+CHUNK, acSteps.length);
      for(;i<end;i++){
        const ac=acSteps[i];
        for(let g=0;g<360;g+=5){
          const sR=computeScore(pdR.patient,ac,g,evRxP.sigma??5,beta,"right",evRxP.hDistort??0.3);
          // Left eye must be scored at the mirrored gamma so both eyes
          // correspond to the same head-fixed gaze direction.
          // gamma=0 for right eye = patient looks right (nasal R).
          // For left eye, same head direction = patient looks right = temporal L = gamma=180.
          // Therefore: gL = (180 - g + 360) % 360
          const gL=(180-g+360)%360;
          const sL=computeScore(pdL.patient,ac,gL,evRxP.sigma??5,beta,"left", evRxP.hDistort??0.3);
          if(!sR&&!sL) continue;
          candidates.push({ac,g,
            rawR:sR?sR.mainScore:0, FR:sR?sR.F:0,
            rawL:sL?sL.mainScore:0, FL:sL?sL.F:0});
        }
      }
      if(i<acSteps.length){setTimeout(runChunk,0);return;}
      if(!candidates.length){
        optResults[key]={alpha_c:thetaCenter(1),alpha:thetaNodal(thetaCenter(1)),gamma:0,score:0};
      } else {
        const maxRR=Math.max(...candidates.map(c=>c.rawR))||1e-9;
        const maxRL=Math.max(...candidates.map(c=>c.rawL))||1e-9;
        const maxFR=Math.max(...candidates.map(c=>c.FR))||1e-9;
        const maxFL=Math.max(...candidates.map(c=>c.FL))||1e-9;
        let best=-Infinity, ba_c=thetaCenter(1), bg=0;
        for(const cc of candidates){
          const sR=cc.rawR/maxRR - (evRxP.mu??0.2)*(cc.FR/maxFR);
          const sL=cc.rawL/maxRL - (evRxP.mu??0.2)*(cc.FL/maxFL);
          const score=omega*sR+(1-omega)*sL;
          if(score>best){best=score;ba_c=cc.ac;bg=cc.g;}
        }
        optResults[key]={alpha_c:ba_c,alpha:thetaNodal(ba_c),gamma:bg,score:best};
      }
      if(--slotsRemaining===0){
        const oW=optResults.weighted;
        setRxEV({committedSigma:evRxP.sigma??5,
          optima:{Aonly:optResults.Aonly,Conly:optResults.Conly,weighted:oW},
          alpha_c:oW.alpha_c, gamma:oW.gamma, status:"done"});
      }
    }
    setTimeout(runChunk,0);
  });
}

/**
