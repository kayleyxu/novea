// ── Reusable map block factory ───────────────────────────────────────────────
/**
 * Creates a zoomable retinal map panel: a circular canvas with zoom buttons
 * (−, +, reset) and pan-by-drag support. Used for all retinal map displays
 * in the prescription screen (right eye MS, left eye MS, EV maps).
 *
 * Returns an object with:
 *   canvas     - The <canvas> element to draw on
 *   block      - The full panel div (label + zoom bar + canvas clip)
 *   wireEvents - Call this after inserting block into the DOM to enable
 *                mouse wheel zoom and drag-to-pan
 *
 * Zoom state is stored in appState[mzKey] so it survives re-renders.
 * The zoom buttons patch the canvas transform directly (no full render)
 * so zooming in/out never resets the page scroll position.
 *
 * @param {number} size        - Canvas width and height in pixels
 * @param {string} mzKey       - Key in appState for storing zoom state (e.g. "mapZoom")
 * @param {string} label       - Label shown above the map
 * @param {string} borderColor - Accent colour for label and zoom buttons
 * @returns {{canvas, clip, zoomBar, block, wireEvents}}
 */
// wireEvents() must be called in a requestAnimationFrame after DOM insertion
function makeMapBlock(size, mzKey, label, borderColor) {
  if (!appState[mzKey]) appState[mzKey]={scale:1,ox:0,oy:0,dragging:false,lastX:0,lastY:0};
  const mz = appState[mzKey];
  const canvas = h("canvas",{width:String(size),height:String(size),
    style:{display:"block",borderRadius:"50%",border:"2px solid #cbd5e1",
      boxShadow:"0 6px 28px rgba(0,0,0,0.12)",
      transformOrigin:"center center",
      transform:`scale(${mz.scale}) translate(${mz.ox/mz.scale}px,${mz.oy/mz.scale}px)`,
      transition:"none",cursor:mz.scale>1?"grab":"default",
      imageRendering:"crisp-edges"}});
  const clip = h("div",{style:{
    width:`${size}px`,height:`${size}px`,
    borderRadius:"50%",overflow:"hidden",position:"relative",
    flexShrink:"0"}},
    canvas);
  const zBtn=(lbl,onclick)=>h("button",{
    style:btnStyle({padding:"5px 13px",fontSize:"15px",fontWeight:"700",
      background:"#f4f0f8",color:borderColor||"#6b0070",border:`1px solid #e8d0ec`,borderRadius:"6px"}),
    onclick},lbl);
  const zoomSpan = h("span",{style:{fontSize:"11px",fontFamily:"monospace",
    color:borderColor||"#6b0070",fontWeight:"700",minWidth:"36px",textAlign:"center"}},
    `${Math.round(mz.scale*100)}%`);
  // Zoom apply — patches transform + label in-place, no render(), no scroll reset
  const applyZoom=()=>{
    canvas.style.transform=`scale(${mz.scale}) translate(${mz.ox/mz.scale}px,${mz.oy/mz.scale}px)`;
    canvas.style.cursor=mz.scale>1?"grab":"default";
    zoomSpan.textContent=`${Math.round(mz.scale*100)}%`;
  };
  const zoomBar = h("div",{style:{display:"flex",alignItems:"center",gap:"8px",
    marginBottom:"8px",justifyContent:"center"}},
    zBtn("−",()=>{mz.scale=Math.max(1,+(mz.scale-0.5).toFixed(1));if(mz.scale===1){mz.ox=0;mz.oy=0;}applyZoom();}),
    zoomSpan,
    zBtn("+",()=>{mz.scale=Math.min(6,+(mz.scale+0.5).toFixed(1));applyZoom();}),
    zBtn("⟳",()=>{mz.scale=1;mz.ox=0;mz.oy=0;applyZoom();})
  );
  const block = h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center"}},
    h("div",{style:{fontSize:"11px",fontWeight:"700",color:borderColor||"#6b0070",
      letterSpacing:"2px",textTransform:"uppercase",marginBottom:"10px",fontFamily:"monospace",
      borderBottom:`1px solid #e8d0ec`,paddingBottom:"6px",width:"100%",textAlign:"left"}},label),
    zoomBar, clip);
  function wireEvents() {
    clip.addEventListener("wheel",(e)=>{
      e.preventDefault();
      const delta=e.deltaY>0?-0.25:0.25;
      mz.scale=Math.min(6,Math.max(1,+(mz.scale+delta).toFixed(2)));
      if(mz.scale===1){mz.ox=0;mz.oy=0;}
      canvas.style.transform=`scale(${mz.scale}) translate(${mz.ox/mz.scale}px,${mz.oy/mz.scale}px)`;
      zoomSpan.textContent=`${Math.round(mz.scale*100)}%`;
    },{passive:false});
    clip.addEventListener("mousedown",(e)=>{
      if(mz.scale<=1) return;
      mz.dragging=true; mz.lastX=e.clientX; mz.lastY=e.clientY;
      canvas.style.cursor="grabbing"; e.preventDefault();
    });
    window.addEventListener("mousemove",(e)=>{
      if(!mz.dragging) return;
      const dx=e.clientX-mz.lastX, dy=e.clientY-mz.lastY;
      mz.lastX=e.clientX; mz.lastY=e.clientY;
      const maxOff=(mz.scale-1)*size/2;
      mz.ox=Math.max(-maxOff,Math.min(maxOff,mz.ox+dx));
      mz.oy=Math.max(-maxOff,Math.min(maxOff,mz.oy+dy));
      canvas.style.transform=`scale(${mz.scale}) translate(${mz.ox/mz.scale}px,${mz.oy/mz.scale}px)`;
    });
    window.addEventListener("mouseup",()=>{
      if(!mz.dragging) return;
      mz.dragging=false; canvas.style.cursor=mz.scale>1?"grab":"default";
    });
  }
  return {canvas, clip, zoomBar, block, wireEvents};
}


// ── Export scotoma map as JSON ──────────────────────────────────────────────
/**
 * Exports the patient's scotoma map as a JSON file that the user can
 * download and reload later. The file contains the drawn grid cells
 * and metadata (eye, date, totals). When loaded back, the full patient
 * mask can be reconstructed without needing to redo the Amsler test.
 *
 * @param {object} pd - Patient data object from diagFinish or loadDamageMap
 */
function saveDamageMap(pd) {
  if (!pd) return;
  const payload = {
    novea_version: "2.0",
    eye: pd.eye,
    saved: new Date().toISOString(),
    scotomaCells:    [...pd.scotomaCells],
    subScotomaCells: [...pd.subScotomaCells],
    distortCells:    [...pd.distortCells],
    totalDeg2:   pd.totalDeg2,
    distortDeg2: pd.distortDeg2,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = `novea_scotoma_${pd.eye}_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

  );

  // Helper: styled output box with stale overlay
  const isStale=rx.status==="stale"||rx.status==="idle";
  const isComp=rx.status==="computing";

  const outputBox=(title,inner)=>{
    return h("div",{style:{
      background:isStale?"#faf5fb":"#f5eafa",
      border:`2px solid ${isStale?"#e8d0ec":"#6b0070"}`,

      transition:"all 0.25s", boxShadow:isStale?"none":"0 1px 6px rgba(107,0,112,0.15)"
    }},
      h("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px",
        borderBottom:`1px solid ${isStale?"#e8d0ec":"#d8a8dc"}`,paddingBottom:"6px"}},
        h("span",{style:{fontSize:"10px",fontWeight:"700",letterSpacing:"2px",textTransform:"uppercase",
          fontFamily:"monospace",color:isStale?"#9370a0":"#6b0070"}},"▸ "+title),
        isStale?h("span",{style:{fontSize:"10px",color:"#b45309",fontFamily:"monospace",

                h("div",{style:{width:Math.round(rxL.gamma/355*100)+"%",height:"100%",borderRadius:"3px",background:"#5b9bd5"}})))
          )
        ),
        rxLDone?h("div",{style:{fontSize:"11px",color:"#1a1a1a",fontFamily:"monospace",background:"#e8e0f4",padding:"7px 10px",borderRadius:"5px"}},
          "From β=",rxL.beta.toFixed(2),", σ=",rxL.sigma,"°, μ=",rxL.mu.toFixed(2),", LEFT eye"):null,

      );

      // Left map — 480px with zoom
      const _lmb=makeMapBlock(480,"mapZoomL","LEFT EYE — Scotoma Map","#6b0070");
      _rxMapCanvasRefL=_lmb.canvas;
      requestAnimationFrame(()=>_lmb.wireEvents());

      const lSideBar=h("div",{class:"rx-sidebar",style:{display:"flex",gap:"12px",alignItems:"flex-start",flex:"0 0 auto",minWidth:"340px",maxWidth:"500px"}},
        h("div",{style:{display:"flex",flexDirection:"column",gap:"8px",minWidth:"240px",flex:"1 1 240px"}},
          leftSlidersCard, runBtnL, leftPrescCard)
      );

      sections.push(h("div",{style:{marginTop:"24px",borderTop:"2px solid #e8d0ec",paddingTop:"20px"}},
        h("div",{style:{fontSize:"10px",color:"#6b0070",fontFamily:"monospace",fontWeight:"700",
          letterSpacing:"2px",marginBottom:"14px"}},"LEFT EYE — INDEPENDENT MS PRESCRIPTION"),
        h("div",{class:"rx-grid",style:{display:"flex",gap:"24px",alignItems:"flex-start",flexWrap:"nowrap",width:"max-content",overflowX:"auto",paddingBottom:"12px"}},
          lSideBar,
          h("div",{class:"rx-map-block",style:{display:"flex",flexDirection:"column",alignItems:"center"}},
            _lmb.block)
        )
      ));
    }

    // ─────────────────────────────────────────────────────────────────
    // ECCENTRIC VIEWING SECTION — single (α,γ), two 480px maps
    // ─────────────────────────────────────────────────────────────────
    {
      const evRx=appState.rxEV;
      const isCompEV=evRx.status==="computing";
      const evDone=(evRx.status==="done"||evRx.status==="computing"||evRx.status==="stale")&&evRx.alpha_c>0;
      const alphaEV=evRx.alpha_c>0?thetaNodal(evRx.alpha_c):0;
      const omega=evRx.omega??0.5;

      const mkSlEV=(label,min,max,step,val,color,note,fmt,onCh)=>sliderEl({label,min,max,step,val,color,note,fmt,
        onLiveInput:v=>{ onCh(v); },
        onChange:v=>{ onCh(v); redrawMaps(); }});

      const omegaSlider=sliderEl({label:"ω — Right Eye Weight",min:0,max:1,step:0.05,val:omega,
        color:"#7c3aed",note:"ω=1: right only, ω=0.5: equal, ω=0: left only",
        fmt:v=>v.toFixed(2),
        onLiveInput:v=>{ appState.rxEV.omega=v; appState.rxEV.status="stale"; },
        onChange:v=>{ appState.rxEV.omega=v; redrawMaps(); }});
      const evSigmaSlider=mkSlEV("σ — Task Radius",2,20,0.5,evRx.sigma??5,"#cc3300","Task radius",v=>`${v}°`,v=>{appState.rxEV.sigma=v;appState.rxEV.status="stale";});
      const evBetaSlider= mkSlEV("β — Acuity Emphasis",0.05,1,0.05,evRx.beta??0.5,"#5b9bd5","Acuity weight",v=>v.toFixed(2),v=>{appState.rxEV.beta=v;appState.rxEV.status="stale";});
      const evMuSlider=   mkSlEV("μ — Fragmentation Penalty",0,1,0.05,evRx.mu??0.2,"#6b0070","Frag penalty",v=>v.toFixed(2),v=>{appState.rxEV.mu=v;appState.rxEV.status="stale";});
      const evRhoSlider=(patientDataR&&(patientDataR.distortDeg2>0||patientDataR.distortCells?.size>0))||(patientDataL&&(patientDataL.distortDeg2>0||patientDataL.distortCells?.size>0))
        ?mkSlEV("ρ — Distortion Health",0,1.0,0.05,evRx.hDistort??0.3,"#d97706","Partial H for distortion cells",v=>v.toFixed(2),v=>{appState.rxEV.hDistort=v;appState.rxEV.status="stale";})
        :null;

      const runBtnEV=h("button",{
        style:btnStyle({width:"100%",padding:"12px",fontSize:"13px",marginTop:"4px",
          background:isCompEV?"#f5eafa":evRx.status==="stale"?"#fff3cd":"#7c3aed",
          color:isCompEV?"#6b0070":evRx.status==="stale"?"#7a3800":"#ffffff",
          border:isCompEV?"1px solid #d8a8dc":evRx.status==="stale"?"1px solid #f0a000":"1px solid #5b21b6"}),
        onclick:rxAutoRunEV},
        isCompEV?h("span",{class:"computing-dots"},"Computing")
        :evRx.status==="stale"?"↺  Regenerate EV":"▶  Generate EV Prescription");

      const evCard=evDone?h("div",{style:{marginTop:"8px"}},
        // PRL prescription boxes — same style as right/left
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}},
          h("div",{style:{background:"#f4f0f8",border:"1px solid #e8d0ec",borderRadius:"8px",padding:"12px 14px"}},
            h("div",{style:{fontSize:"10px",color:"#6b0070",letterSpacing:"1px",fontFamily:"monospace",fontWeight:"700",marginBottom:"4px"}},"ECCENTRICITY"),
            h("div",{style:{fontSize:"28px",fontWeight:"700",color:"#3d0042",fontFamily:"monospace",lineHeight:"1"}},alphaEV.toFixed(1)+"°"),
            h("div",{style:{fontSize:"11px",color:"#1a1a1a",fontFamily:"monospace",marginTop:"4px"}},"θ_n="+alphaEV.toFixed(1)+"°, θ_c="+evRx.alpha_c.toFixed(1)+"°"),
            h("div",{style:{marginTop:"10px"}},
              h("div",{style:{width:"100%",height:"6px",borderRadius:"3px",background:"#ddd0e8"}},
                h("div",{style:{width:Math.round(alphaEV/35*100)+"%",height:"100%",borderRadius:"3px",background:"#cc3300"}})))
          ),
          h("div",{style:{background:"#f4f0f8",border:"1px solid #e8d0ec",borderRadius:"8px",padding:"12px 14px"}},
            h("div",{style:{fontSize:"10px",color:"#6b0070",letterSpacing:"1px",fontFamily:"monospace",fontWeight:"700",marginBottom:"4px"}},"AZIMUTH"),
            h("div",{style:{fontSize:"28px",fontWeight:"700",color:"#3d0042",fontFamily:"monospace",lineHeight:"1"}},evRx.gamma+"°"),
            h("div",{style:{marginTop:"10px"}},
              h("div",{style:{width:"100%",height:"6px",borderRadius:"3px",background:"#ddd0e8"}},
                h("div",{style:{width:Math.round(evRx.gamma/355*100)+"%",height:"100%",borderRadius:"3px",background:"#5b9bd5"}})))
          )
        ),

      ):h("div",{style:{fontSize:"11px",color:"#1a1a1a",fontFamily:"monospace",padding:"8px 0",marginTop:"8px"}},
          "Run optimizer to compute shared EV direction");

      const evControlCol=h("div",{class:"rx-sidebar",style:{display:"flex",gap:"12px",alignItems:"flex-start",flex:"0 0 auto",minWidth:"300px",maxWidth:"420px"}},
        h("div",{style:{...card(),background:"#faf5ff",border:"1px solid #ddd6fe",minWidth:"240px",flex:"1 1 240px"}},
          secLabel("EV — Joint Score Parameters"),
          h("div",{style:{fontSize:"11px",color:"#374151",fontFamily:"monospace",lineHeight:"1.6",
            marginBottom:"10px",background:"#f5f3ff",borderRadius:"4px",padding:"6px 8px"}},
            "Single (α,γ) maximising ω·RCS_R + (1−ω)·RCS_L."),
          omegaSlider, evSigmaSlider, evBetaSlider, evMuSlider, evRhoSlider,
          runBtnEV,
          evCard
        )
      );

      // Two 480px maps with zoom
      const _evmbR=makeMapBlock(480,"mapZoomEVR","RIGHT RETINA","#7c3aed");
      const _evmbL=makeMapBlock(480,"mapZoomEVL","LEFT RETINA","#1e40af");
      _rxMapCanvasRefEVR=_evmbR.canvas;
      _rxMapCanvasRefEVL=_evmbL.canvas;
      requestAnimationFrame(()=>{_evmbR.wireEvents();_evmbL.wireEvents();});

      sections.push(h("div",{style:{marginTop:"24px",borderTop:"2px solid #ddd6fe",paddingTop:"20px"}},
        h("div",{style:{fontSize:"10px",color:"#7c3aed",fontFamily:"monospace",fontWeight:"700",
          letterSpacing:"2px",marginBottom:"14px"}},"ECCENTRIC VIEWING — BINOCULAR JOINT PRESCRIPTION"),
        h("div",{style:{display:"flex",gap:"24px",alignItems:"flex-start",flexWrap:"nowrap",width:"max-content",overflowX:"auto",paddingBottom:"12px"}},
          evControlCol,
          h("div",{class:"rx-map-block",style:{display:"flex",flexDirection:"column",alignItems:"center"}},_evmbR.block),
          h("div",{class:"rx-map-block",style:{display:"flex",flexDirection:"column",alignItems:"center"}},_evmbL.block)
        )
      ));
    }

    // ─────────────────────────────────────────────────────────────────
    // v8 — BINOCULAR MS CO-PRESCRIPTION SECTION
    // Independent (α_R,γ_R) and (α_L,γ_L) with delta constraints.
    // All new code — nothing above this block is touched.
    // ─────────────────────────────────────────────────────────────────
    {
      const ms = appState.rxMS;
      const msDone = ms.status === "done" && ms.alpha_cR > 0;
      const msComp = ms.status === "computing";

      const mkSlMS = (label, min, max, step, val, color, note, fmt, onCh) =>
        sliderEl({label, min, max, step, val, color, note, fmt,
          onLiveInput: v => { appState.rxMS[onCh] = v; },
          onChange:    v => { appState.rxMS[onCh] = v; appState.rxMS.status = "stale"; redrawMaps(); }});

      // Constraint sliders
      const deltaAlphaSlider = sliderEl({
        label:"Δα — Eccentricity tolerance", min:0, max:10, step:0.5,
        val:ms.deltaAlpha??2, color:"#6b0070", note:"Max |α_R − α_L| allowed (degrees)",
        fmt:v=>v.toFixed(1),
        onLiveInput:v=>{ appState.rxMS.deltaAlpha=v; },
        onChange:v=>{ appState.rxMS.deltaAlpha=v; appState.rxMS.status="stale"; redrawMaps(); }
      });
      const deltaGammaSlider = sliderEl({
        label:"Δγ — Azimuth tolerance", min:0, max:30, step:2,
        val:ms.deltaGamma??15, color:"#0284c7", note:"Max azimuth diff between eyes (degrees) — ~2–4° retinal arc at typical eccentricity",
        fmt:v=>v.toFixed(0)+"°",
        onLiveInput:v=>{ appState.rxMS.deltaGamma=v; },
        onChange:v=>{ appState.rxMS.deltaGamma=v; appState.rxMS.status="stale"; redrawMaps(); }
      });
      const msOmegaSlider = sliderEl({
        label:"ω — Right Eye Weight", min:0, max:1, step:0.05,
        val:ms.omega??0.5, color:"#7c3aed", note:"0=left only, 0.5=equal, 1=right only",
        fmt:v=>v.toFixed(2),
        onLiveInput:v=>{ appState.rxMS.omega=v; },
        onChange:v=>{ appState.rxMS.omega=v; appState.rxMS.status="stale"; redrawMaps(); }
      });
      const msSigmaSlider = sliderEl({
        label:"σ — Task Radius", min:2, max:20, step:1,
        val:ms.sigma??5, color:"#cc3300", note:"Task window radius (degrees)",
        fmt:v=>v+"°",
        onLiveInput:v=>{ appState.rxMS.sigma=v; },
        onChange:v=>{ appState.rxMS.sigma=v; appState.rxMS.status="stale"; redrawMaps(); }
      });
      const msBetaSlider = sliderEl({
        label:"β — Acuity Emphasis", min:0.05, max:1, step:0.05,
        val:ms.beta??0.5, color:"#5b9bd5", note:"Acuity weight",
        fmt:v=>v.toFixed(2),
        onLiveInput:v=>{ appState.rxMS.beta=v; },
        onChange:v=>{ appState.rxMS.beta=v; appState.rxMS.status="stale"; redrawMaps(); }
      });
      const msMuSlider = sliderEl({
        label:"μ — Fragmentation Penalty", min:0, max:1, step:0.05,
        val:ms.mu??0.2, color:"#6b0070", note:"Fragmentation penalty",
        fmt:v=>v.toFixed(2),
        onLiveInput:v=>{ appState.rxMS.mu=v; },
        onChange:v=>{ appState.rxMS.mu=v; appState.rxMS.status="stale"; redrawMaps(); }
      });

      const runBtnMS = h("button",{
        id:"ms-coopt-btn",
        style:btnStyle({width:"100%",padding:"12px",fontSize:"13px",fontWeight:"700",
          background:msComp?"#f5eafa":ms.status==="stale"?"#fff3cd":"#6b0070",
          color:msComp?"#6b0070":ms.status==="stale"?"#7a3800":"#fff",
          border:msComp?"1px solid #d8a8dc":ms.status==="stale"?"1px solid #f0a000":"1px solid #4a0050"}),
        disabled:msComp,
        onclick:rxAutoRunMS},
        msComp?"Computing…":ms.status==="stale"?"↺  Regenerate MS Co-Prescription":"▶  Generate MS Co-Prescription");

      // Result cards — shown once done
      const alphaR = thetaNodal(ms.alpha_cR), alphaL = thetaNodal(ms.alpha_cL);
      const msPrescCard = msDone ? h("div",{style:{marginTop:"10px"}},
        // Right eye PRL
        h("div",{style:{fontSize:"10px",color:"#6b0070",fontFamily:"monospace",fontWeight:"700",
          letterSpacing:"2px",marginBottom:"6px"}},"RIGHT EYE — MS PRL"),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"12px"}},
          h("div",{style:{background:"#f4f0f8",border:"1px solid #e8d0ec",borderRadius:"8px",padding:"12px 14px"}},
            h("div",{style:{fontSize:"10px",color:"#6b0070",letterSpacing:"1px",fontFamily:"monospace",fontWeight:"700",marginBottom:"4px"}},"ECCENTRICITY"),
            h("div",{style:{fontSize:"28px",fontWeight:"700",color:"#3d0042",fontFamily:"monospace",lineHeight:"1"}},alphaR.toFixed(1)+"°"),
            h("div",{style:{fontSize:"11px",color:"#1a1a1a",fontFamily:"monospace",marginTop:"4px"}},"θ_n="+alphaR.toFixed(1)+"°, θ_c="+ms.alpha_cR.toFixed(1)+"°"),
            h("div",{style:{marginTop:"10px"}},
              h("div",{style:{width:"100%",height:"6px",borderRadius:"3px",background:"#ddd0e8"}},
                h("div",{style:{width:Math.round(alphaR/35*100)+"%",height:"100%",borderRadius:"3px",background:"#cc3300",pointerEvents:"none"}})))
          ),
          h("div",{style:{background:"#f4f0f8",border:"1px solid #e8d0ec",borderRadius:"8px",padding:"12px 14px"}},
            h("div",{style:{fontSize:"10px",color:"#6b0070",letterSpacing:"1px",fontFamily:"monospace",fontWeight:"700",marginBottom:"4px"}},"AZIMUTH"),
            h("div",{style:{fontSize:"28px",fontWeight:"700",color:"#3d0042",fontFamily:"monospace",lineHeight:"1"}},ms.gammaR+"°"),
            h("div",{style:{marginTop:"10px"}},
              h("div",{style:{width:"100%",height:"6px",borderRadius:"3px",background:"#ddd0e8"}},
                h("div",{style:{width:Math.round(ms.gammaR/355*100)+"%",height:"100%",borderRadius:"3px",background:"#5b9bd5",pointerEvents:"none"}})))
          )
        ),
        // Left eye PRL
        h("div",{style:{fontSize:"10px",color:"#1a4a90",fontFamily:"monospace",fontWeight:"700",
          letterSpacing:"2px",marginBottom:"6px"}},"LEFT EYE — MS PRL"),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}},
          h("div",{style:{background:"#dbeafe",border:"1px solid #93c5fd",borderRadius:"8px",padding:"12px 14px"}},
            h("div",{style:{fontSize:"10px",color:"#1a4a90",letterSpacing:"1px",fontFamily:"monospace",fontWeight:"700",marginBottom:"4px"}},"ECCENTRICITY"),
            h("div",{style:{fontSize:"28px",fontWeight:"700",color:"#0a2a70",fontFamily:"monospace",lineHeight:"1"}},alphaL.toFixed(1)+"°"),
            h("div",{style:{fontSize:"11px",color:"#1a1a1a",fontFamily:"monospace",marginTop:"4px"}},"θ_n="+alphaL.toFixed(1)+"°, θ_c="+ms.alpha_cL.toFixed(1)+"°"),
            h("div",{style:{marginTop:"10px"}},
              h("div",{style:{width:"100%",height:"6px",borderRadius:"3px",background:"#bfdbfe"}},
                h("div",{style:{width:Math.round(alphaL/35*100)+"%",height:"100%",borderRadius:"3px",background:"#cc3300",pointerEvents:"none"}})))
          ),
          h("div",{style:{background:"#dbeafe",border:"1px solid #93c5fd",borderRadius:"8px",padding:"12px 14px"}},
            h("div",{style:{fontSize:"10px",color:"#1a4a90",letterSpacing:"1px",fontFamily:"monospace",fontWeight:"700",marginBottom:"4px"}},"AZIMUTH"),
            h("div",{style:{fontSize:"28px",fontWeight:"700",color:"#0a2a70",fontFamily:"monospace",lineHeight:"1"}},ms.gammaL+"°"),
            h("div",{style:{marginTop:"10px"}},
              h("div",{style:{width:"100%",height:"6px",borderRadius:"3px",background:"#bfdbfe"}},
                h("div",{style:{width:Math.round(ms.gammaL/355*100)+"%",height:"100%",borderRadius:"3px",background:"#5b9bd5",pointerEvents:"none"}})))
          )
        ),
        // Delta summary
        h("div",{style:{fontSize:"11px",color:"#374151",fontFamily:"monospace",background:"#f8fafc",
          border:"1px solid #e2e8f0",borderRadius:"5px",padding:"7px 10px"}},
          "Δα = "+Math.abs(thetaNodal(ms.alpha_cR)-thetaNodal(ms.alpha_cL)).toFixed(1)+"°, "+
          "Δγ = "+angDiff(ms.gammaR,ms.gammaL).toFixed(0)+"°, "+
          "constraint: Δα≤"+ms.deltaAlpha+"°, Δγ≤"+ms.deltaGamma+"°")
      ) : null;

      // Two retinal maps for MS co-opt
      const _msmbR = makeMapBlock(480,"mapZoomMSR","RIGHT RETINA — MS Co-Opt","#6b0070");
      const _msmbL = makeMapBlock(480,"mapZoomMSL","LEFT RETINA — MS Co-Opt","#1e40af");
      _rxMapCanvasRefMSR = _msmbR.canvas;
      _rxMapCanvasRefMSL = _msmbL.canvas;
      requestAnimationFrame(()=>{ _msmbR.wireEvents(); _msmbL.wireEvents(); });

      // Draw MS co-opt maps after DOM insertion
      requestAnimationFrame(()=>{
        const showMS = msDone;
        if (_rxMapCanvasRefMSR && patientDataR) {
          const optR = showMS ? {weighted:{alpha_c:ms.alpha_cR,alpha:thetaNodal(ms.alpha_cR),gamma:ms.gammaR},Aonly:null,Conly:null} : null;
          drawRetinalMap(_rxMapCanvasRefMSR, patientDataR.patient, showMS?thetaNodal(ms.alpha_cR):0, showMS?ms.gammaR:0, ms.sigma, ms.sigma, optR, 480, "right");
        }
        if (_rxMapCanvasRefMSL && patientDataL) {
          const mirG = g => (180-g+360)%360;
          const optL = showMS ? {weighted:{alpha_c:ms.alpha_cL,alpha:thetaNodal(ms.alpha_cL),gamma:mirG(ms.gammaL)},Aonly:null,Conly:null} : null;
          drawRetinalMap(_rxMapCanvasRefMSL, patientDataL.patient, showMS?thetaNodal(ms.alpha_cL):0, showMS?mirG(ms.gammaL):0, ms.sigma, ms.sigma, optL, 480, "left");
        }
      });

      const msControlCol = h("div",{class:"rx-sidebar",style:{display:"flex",gap:"12px",alignItems:"flex-start",flex:"0 0 auto",minWidth:"300px",maxWidth:"420px"}},
        h("div",{style:{...card(),background:"#faf5ff",border:"1px solid #ddd6fe",minWidth:"240px",flex:"1 1 240px"}},
          h("div",{style:{fontSize:"10px",fontWeight:"700",letterSpacing:"2px",color:"#6b0070",
            fontFamily:"monospace",marginBottom:"12px"}},"MS CO-PRESCRIPTION PARAMETERS"),
          h("div",{style:{fontSize:"11px",color:"#374151",fontFamily:"monospace",lineHeight:"1.6",
            marginBottom:"10px",background:"#f0e4f2",borderRadius:"4px",padding:"6px 8px"}},
            "Independent PRL per eye — constrained by Δα and Δγ."),
          deltaAlphaSlider, deltaGammaSlider, msOmegaSlider,
          msSigmaSlider, msBetaSlider, msMuSlider,
          runBtnMS,
          msPrescCard
        )
      );

      sections.push(h("div",{style:{marginTop:"24px",borderTop:"2px solid #e8d0ec",paddingTop:"20px"}},
        h("div",{style:{fontSize:"10px",color:"#6b0070",fontFamily:"monospace",fontWeight:"700",
          letterSpacing:"2px",marginBottom:"14px"}},"MS CO-PRESCRIPTION — BINOCULAR INDEPENDENT PRL"),
        h("div",{style:{display:"flex",gap:"24px",alignItems:"flex-start",flexWrap:"nowrap",width:"max-content",overflowX:"auto",paddingBottom:"12px"}},
          msControlCol,
          h("div",{class:"rx-map-block",style:{display:"flex",flexDirection:"column",alignItems:"center"}},_msmbR.block),
          h("div",{class:"rx-map-block",style:{display:"flex",flexDirection:"column",alignItems:"center"}},_msmbL.block)
        )
      ));
    }
    // ─── end v8 MS Co-Prescription section ───────────────────────────────────

    binoSection=h("div",null,...sections);
  }

    const wrap=h("div",{style:{padding:"20px"}},header,formulaBar,grid,binoSection||"");

  requestAnimationFrame(()=>{
    _rxMapCanvasRef=mapCanvas_ref;
    const showResults=rx.status==="done"||rx.status==="computing"||rx.status==="stale";
    const _eye1=patientDataR?patientDataR.eye:"right";
    drawRetinalMap(mapCanvas_ref,patientDataR?patientDataR.patient:patient,showResults?alpha:0,showResults?rx.gamma:0,rx.sigma,rx.committedSigma,showResults?rx.optima:null,480,_eye1);
  });

  return wrap;
}

// ═══════════════════════════════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════════════════════════════
/**
 * Rebuilds the entire app HTML from scratch based on the current appState.
 * Called by render() on every state change. Decides which screen to show
 * (home, diagnostic, or prescription) and replaces the #app container content.
 *
 * Also handles:
 *   - The "IMPORTING SCOTOMA MAP" overlay while loading a JSON file
 *   - Synchronous canvas wiring for the diagnostic draw screen
 *   - Saving and restoring scroll position (via render() wrapper) so the
 *     page doesn't jump to the top on every update
 */
function renderApp() {
  const d=appState.diag;
  const s=appState;
  const appEl=document.getElementById("app");

  // App header
  const header=h("div",{id:"app-header",style:{background:"#ffffff",borderBottom:"1px solid #e8d0ec",boxShadow:"0 1px 6px rgba(107,0,112,0.10)",padding:"12px 24px",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:"0"}},
    h("div",null,
      h("span",{style:{fontSize:"28px",fontWeight:"900",color:"#6b0070",letterSpacing:"-1px",fontFamily:"monospace"}},"Novea"),
      h("span",{style:{fontSize:"10px",color:"#c0a0c8",marginLeft:"14px",fontFamily:"monospace",fontWeight:"400"}},"PRL Prescription Tool"),
      h("div",{style:{fontSize:"11px",color:"#6b0070",fontFamily:"monospace",marginTop:"3px",letterSpacing:"0.5px",fontWeight:"600"}},"Patent Pending — U.S. App. No. 64/007,747")
    ),
    h("div",{style:{display:"flex",gap:"8px",alignItems:"center"}},
      s.screen==="prescription"?h("span",{style:{fontSize:"10px",color:"#b45309",fontFamily:"monospace"}},
        s.patientData?`Patient scan · ${s.patientData.eye} eye`:"Demo · Binocular"):null,
    h("div",{style:{display:"flex",gap:"6px",alignItems:"center"}},
      h("button",{
        style:btnStyle({padding:"7px 14px",border:"1px solid #e8d0ec",borderRadius:"6px",fontSize:"12px",fontWeight:"700",
          background:s.screen==="home"?"#6b0070":"#f0e4f2",
          color:s.screen==="home"?"#ffffff":"#3d0042"}),
        onclick:()=>setState({screen:"home"})
      },"⌂ Home"),
      ...["diagnostic","prescription"].map(sc=>h("button",{
        style:btnStyle({padding:"7px 18px",border:"none",borderRadius:"6px",fontSize:"13px",fontWeight:"700",
          background:s.screen===sc?"#6b0070":"#f0e4f2",
          color:s.screen===sc?"#ffffff":"#3d0042",
          boxShadow:s.screen===sc?"0 2px 8px rgba(107,0,112,0.35)":"none"}),
        onclick:()=>{
          if (sc==="prescription"&&!s.patientData&&s.screen!=="prescription") {
            setState({patientData:null,screen:"prescription"}); setTimeout(rxAutoRun,50);
          } else setState({screen:sc});
        }},
        sc==="diagnostic"?"① Diagnostic":"② Prescription"))
    )
    )
  );

  let content;
  if (s.screen==="home") content=renderHome();
  else if (s.screen==="diagnostic") content=d.step==="instructions"?renderDiagInstructions():renderDiagDraw();
  else content=renderPrescription();

  appEl.innerHTML="";
  appEl.appendChild(header);
  const contentWrap=document.createElement("div");
  contentWrap.style.cssText="flex:1 1 0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;min-height:0;";
  contentWrap.appendChild(content);
  appEl.appendChild(contentWrap);
  // Importing overlay
  if (appState.importing) {
    const overlay=h("div",{style:{position:"fixed",inset:"0",background:"rgba(107,0,112,0.18)",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:"9999"}},
      h("div",{style:{background:"#fff",border:"2px solid #6b0070",borderRadius:"12px",
        padding:"28px 40px",fontFamily:"monospace",textAlign:"center",
        boxShadow:"0 8px 32px rgba(107,0,112,0.25)"}},
        h("div",{style:{fontSize:"13px",fontWeight:"700",color:"#6b0070",letterSpacing:"1px",marginBottom:"10px"}},
          "IMPORTING SCOTOMA MAP"),
        h("div",{style:{fontSize:"12px",color:"#1a1a1a",marginBottom:"14px"}},
          (appState.importing==="right"?"Right":"Left")+" eye · Building retinal mask…"),
        h("span",{class:"computing-dots",style:{fontSize:"13px",color:"#6b0070"}})
      )
    );
    appEl.appendChild(overlay);
  }
  if(_pendingCanvasWire){
    const _wc=_pendingCanvasWire;_pendingCanvasWire=null;
    const _d=appState.diag;
    drawAmslerGrid(_diagCanvasRef,_d.scotomaCells,_d.subScotomaCells,_d.distortCells);
    drawOverlay(_diagOverlayRef,_d.livePoints,_d.isDrawing,_d.tool);
    wireCanvasEvents(_wc);
  }
}

/**
 * The main render function — called whenever app state changes.
 * Saves the page scroll position before rebuilding the DOM, then
 * restores it immediately after, so the page never jumps to the top.
 *
 * After rebuilding the HTML, redraws all canvas elements using
 * requestAnimationFrame so the browser paints the HTML first.
 *
 * Note: Many interactions (zoom, checkboxes, sliders, progress updates)
 * bypass render() entirely and patch the DOM directly via redrawMaps()
 * or in-place element updates, for even better scroll preservation.
 */
/**
 * Redraws only the prescription map canvases — no DOM rebuild, no scroll reset.
 * Used by slider onChange handlers so dragging a slider doesn't jump the page.
 */
/**
 * Redraws only the prescription retinal map canvases — without rebuilding
 * the DOM or resetting the page scroll position.
 *
 * Used by slider onChange handlers and progress updates so that moving a
 * slider or watching the optimizer progress bar doesn't scroll the page
 * back to the top. Much faster than a full render() call.
 *
 * Redraws: right-eye MS map, left-eye MS map (if binocular),
 *           and both EV maps (if binocular).
 */
function redrawMaps() {
  if (appState.screen!=="prescription") return;
  requestAnimationFrame(()=>{
    if (_rxMapCanvasRef) {
      const rx2=appState.rx;
      const pd2=appState.patientDataRight||appState.patientData;
      const pt2=pd2?pd2.patient:PATIENT_DEMO_R.patient;
      const show=(rx2.status==="done"||rx2.status==="computing"||rx2.status==="stale")&&rx2.alpha_c>0;
      drawRetinalMap(_rxMapCanvasRef,pt2,show?thetaNodal(rx2.alpha_c):0,
        show?rx2.gamma:0,rx2.sigma,rx2.committedSigma,show?rx2.optima:null,480,pd2?pd2.eye:"right");
    }
    if (_rxMapCanvasRefL&&appState.binocularMode) {
      const rxL2=appState.rxLeft;
      const pdL2=appState.patientDataLeft;
      if(pdL2&&_rxMapCanvasRefL){
        const showL=(rxL2.status==="done"||rxL2.status==="computing"||rxL2.status==="stale")&&rxL2.alpha_c>0;
        const _mirL=g=>(180-g+360)%360;
        const _optL=rxL2.optima?{
          Aonly:rxL2.optima.Aonly?{...rxL2.optima.Aonly,gamma:_mirL(rxL2.optima.Aonly.gamma)}:null,
          Conly:rxL2.optima.Conly?{...rxL2.optima.Conly,gamma:_mirL(rxL2.optima.Conly.gamma)}:null,
          weighted:rxL2.optima.weighted?{...rxL2.optima.weighted,gamma:_mirL(rxL2.optima.weighted.gamma)}:null,
        }:null;
        drawRetinalMap(_rxMapCanvasRefL,pdL2.patient,showL?thetaNodal(rxL2.alpha_c):0,
          showL?_mirL(rxL2.gamma):0,rxL2.sigma,rxL2.committedSigma,showL?_optL:null,480,"left");
      }
    }
    if (appState.binocularMode) {
      const ev2=appState.rxEV;
      const pdR2=appState.patientDataRight||appState.patientData;
      const pdL2=appState.patientDataLeft;
      const showEV=(ev2.status==="done"||ev2.status==="computing"||ev2.status==="stale")&&ev2.alpha_c>0;
      const evAlpha=showEV?thetaNodal(ev2.alpha_c):0;
      const evGamma=showEV?ev2.gamma:0;
      const evOptima=showEV?ev2.optima:null;
      const evSigma=ev2.committedSigma||appState.rx.sigma;
      const mirrorGamma=g=>(180-g+360)%360;
      const evOptimaL=evOptima?{
        Aonly:evOptima.Aonly?{...evOptima.Aonly,gamma:mirrorGamma(evOptima.Aonly.gamma)}:null,
        Conly:evOptima.Conly?{...evOptima.Conly,gamma:mirrorGamma(evOptima.Conly.gamma)}:null,
        weighted:evOptima.weighted?{...evOptima.weighted,gamma:mirrorGamma(evOptima.weighted.gamma)}:null,
      }:null;
      if(_rxMapCanvasRefEVR&&pdR2)
        drawRetinalMap(_rxMapCanvasRefEVR,pdR2.patient,evAlpha,evGamma,appState.rx.sigma,evSigma,evOptima,480,"right");
      if(_rxMapCanvasRefEVL&&pdL2)
        drawRetinalMap(_rxMapCanvasRefEVL,pdL2.patient,evAlpha,mirrorGamma(evGamma),appState.rxLeft.sigma,evSigma,evOptimaL,480,"left");
    }
    // v8: MS co-opt maps
    const ms2=appState.rxMS;
    const showMS2=ms2.status==="done"&&ms2.alpha_cR>0;
    const pdR3=appState.patientDataRight||appState.patientData;
    const pdL3=appState.patientDataLeft;
    const mirG2=g=>(180-g+360)%360;
    if(_rxMapCanvasRefMSR&&pdR3){
      const optR2=showMS2?{weighted:{alpha_c:ms2.alpha_cR,alpha:thetaNodal(ms2.alpha_cR),gamma:ms2.gammaR},Aonly:null,Conly:null}:null;
      drawRetinalMap(_rxMapCanvasRefMSR,pdR3.patient,showMS2?thetaNodal(ms2.alpha_cR):0,showMS2?ms2.gammaR:0,ms2.sigma,ms2.sigma,optR2,480,"right");
    }
    if(_rxMapCanvasRefMSL&&pdL3){
      const optL2=showMS2?{weighted:{alpha_c:ms2.alpha_cL,alpha:thetaNodal(ms2.alpha_cL),gamma:mirG2(ms2.gammaL)},Aonly:null,Conly:null}:null;
      drawRetinalMap(_rxMapCanvasRefMSL,pdL3.patient,showMS2?thetaNodal(ms2.alpha_cL):0,showMS2?mirG2(ms2.gammaL):0,ms2.sigma,ms2.sigma,optL2,480,"left");
    }
  });
}

function render() {
  // Save scroll position before DOM rebuild, restore after — prevents jump on prescription screen
  const _contentWrap = document.querySelector("#app > div:last-child");
  const _scrollTop = _contentWrap ? _contentWrap.scrollTop : 0;
  renderApp();
  // Restore scroll after new contentWrap is inserted
  if (_scrollTop > 0) {
    const _newWrap = document.querySelector("#app > div:last-child");
    if (_newWrap) _newWrap.scrollTop = _scrollTop;
  }
  // Re-draw canvases after render
  const d=appState.diag;
  if (appState.screen==="diagnostic"&&d.step==="draw") {
    requestAnimationFrame(()=>{
      if (_diagCanvasRef) drawAmslerGrid(_diagCanvasRef,d.scotomaCells,d.subScotomaCells,d.distortCells);
      if (_diagOverlayRef) drawOverlay(_diagOverlayRef,d.livePoints,d.isDrawing,d.tool);
    });
  }
  if (appState.screen==="prescription") {
    // Right-eye MS map
    if (_rxMapCanvasRef) requestAnimationFrame(()=>{
      const rx2=appState.rx;
      const pd2=appState.patientDataRight||appState.patientData;
      const pt2=pd2?pd2.patient:PATIENT_DEMO_R.patient;
      const show=( rx2.status==="done"||rx2.status==="computing"||rx2.status==="stale")&&rx2.alpha_c>0;
      drawRetinalMap(_rxMapCanvasRef,pt2,show?thetaNodal(rx2.alpha_c):0,
        show?rx2.gamma:0,rx2.sigma,rx2.committedSigma,show?rx2.optima:null,480,pd2?pd2.eye:"right");
    });
    // Left-eye MS map (MS tab)
    if (_rxMapCanvasRefL&&appState.binocularMode) requestAnimationFrame(()=>{
      const rxL2=appState.rxLeft;
      const pdL2=appState.patientDataLeft;
      if(!pdL2||!_rxMapCanvasRefL) return;
      const showL=(rxL2.status==="done"||rxL2.status==="computing"||rxL2.status==="stale")&&rxL2.alpha_c>0;
      const _mirL2=g=>(180-g+360)%360;
      const _optL2=rxL2.optima?{
        Aonly:rxL2.optima.Aonly?{...rxL2.optima.Aonly,gamma:_mirL2(rxL2.optima.Aonly.gamma)}:null,
        Conly:rxL2.optima.Conly?{...rxL2.optima.Conly,gamma:_mirL2(rxL2.optima.Conly.gamma)}:null,
        weighted:rxL2.optima.weighted?{...rxL2.optima.weighted,gamma:_mirL2(rxL2.optima.weighted.gamma)}:null,
      }:null;
      drawRetinalMap(_rxMapCanvasRefL,pdL2.patient,showL?thetaNodal(rxL2.alpha_c):0,
        showL?_mirL2(rxL2.gamma):0,rxL2.sigma,rxL2.committedSigma,showL?_optL2:null,480,"left");
    });
    // EV maps — both retinas, same zone
    if (appState.binocularMode) requestAnimationFrame(()=>{
      const ev2=appState.rxEV;
      const pdR2=appState.patientDataRight||appState.patientData;
      const pdL2=appState.patientDataLeft;
      const showEV=(ev2.status==="done"||ev2.status==="computing"||ev2.status==="stale")&&ev2.alpha_c>0;
      const evAlpha=showEV?thetaNodal(ev2.alpha_c):0;
      const evGamma=showEV?ev2.gamma:0;
      const evOptima=showEV?ev2.optima:null;
      const evSigma=ev2.committedSigma||appState.rx.sigma;
      // Mirror optima gammas for left eye display so both maps show zone at same head-fixed direction.
      // γ_left = (180 - γ_right + 360) % 360  [derived from scrAng equality condition]
      const mirrorGamma = g => (180 - g + 360) % 360;
      const evOptimaL = evOptima ? {
        Aonly:    evOptima.Aonly    ? {...evOptima.Aonly,    gamma: mirrorGamma(evOptima.Aonly.gamma)}    : null,
        Conly:    evOptima.Conly    ? {...evOptima.Conly,    gamma: mirrorGamma(evOptima.Conly.gamma)}    : null,
        weighted: evOptima.weighted ? {...evOptima.weighted, gamma: mirrorGamma(evOptima.weighted.gamma)} : null,
      } : null;
      const evGammaL = mirrorGamma(evGamma);
      if(_rxMapCanvasRefEVR&&pdR2)
        drawRetinalMap(_rxMapCanvasRefEVR,pdR2.patient,evAlpha,evGamma,appState.rx.sigma,evSigma,evOptima,480,"right");
      if(_rxMapCanvasRefEVL&&pdL2)
        drawRetinalMap(_rxMapCanvasRefEVL,pdL2.patient,evAlpha,evGammaL,appState.rxLeft.sigma,evSigma,evOptimaL,480,"left");
    });
  }
}

// Boot
render();
</script>
</body>
</html>
